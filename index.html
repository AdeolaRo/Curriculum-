<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Simple Curriculum | Éditeur avancé</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <!-- html2pdf (pour export PDF fiable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- SortableJS pour le drag & drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #e3f0ff;
            padding: 2rem;
            color: #0f172a;
        }

        .app {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .sub {
            opacity: 0.7;
            font-weight: 400;
            color: #1e293b;
        }

        .style-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 1rem 1.8rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .style-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .color-palette {
            display: flex;
            gap: 0.6rem;
        }
        .color-option {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .color-option.active {
            border-color: #0f172a;
            transform: scale(1.1);
        }
        select, button {
            padding: 0.5rem 1.2rem;
            border-radius: 3rem;
            background: white;
            border: 1px solid #cbd5e1;
            color: #0f172a;
            font-family: inherit;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            background: #e2e8f0;
        }

        .cv-maker {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        @media (max-width: 900px) {
            body { padding: 1rem; }
            .cv-maker { grid-template-columns: 1fr; }
            .editor-panel.hide-on-mobile { display: none; }
            .toggle-editor-btn {
                display: block;
                margin-bottom: 1rem;
            }
        }
        .toggle-editor-btn {
            display: none;
            background: #3b82f6;
            border: none;
            width: 100%;
            padding: 0.7rem;
            font-weight: bold;
            color: white;
        }

        .editor-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 1.8rem;
            padding: 1.5rem;
            border: 1px solid rgba(0, 0, 0, 0.05);
            max-height: 85vh;
            overflow-y: auto;
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 1.2rem 0 0.8rem 0;
            border-left: 4px solid #3b82f6;
            padding-left: 0.75rem;
            font-family: 'Playfair Display', serif;
        }
        .section-title:first-of-type { margin-top: 0; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 0.3rem; color: #334155; }
        input, textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }
        input:focus, textarea:focus { outline: none; border-color: #3b82f6; }
        
        .exp-card, .edu-card {
            background: #f8fafc;
            border-radius: 1.2rem;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 3px solid #3b82f6;
            cursor: grab;
        }
        .exp-card:active, .edu-card:active { cursor: grabbing; }
        
        .date-select-group {
            display: flex;
            gap: 0.5rem;
            margin: 0.5rem 0;
        }
        .date-select-group select {
            flex: 1;
            padding: 0.5rem;
            background: white;
        }
        
        .btn-add {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            margin: 0.5rem 0;
        }
        .btn-remove {
            background: #ef4444;
            border: none;
            color: white;
            padding: 0.2rem 0.9rem;
            border-radius: 1.5rem;
            cursor: pointer;
            margin-top: 0.5rem;
            font-size: 0.7rem;
        }
        .skills-container, .interests-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin: 1rem 0;
        }
        .skill-tag, .interest-tag {
            background: #dbeafe;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            display: inline-flex;
            gap: 0.6rem;
            align-items: center;
            font-size: 0.8rem;
        }
        .skill-tag button, .interest-tag button {
            background: none;
            border: none;
            color: #1e3a8a;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
        }
        .add-skill, .add-interest { display: flex; gap: 0.6rem; margin-top: 0.5rem; }
        .add-skill input, .add-interest input { flex: 1; }

        /* Preview */
        .preview-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 1.8rem;
            padding: 1.5rem;
            position: sticky;
            top: 2rem;
            max-height: 90vh;
            overflow-y: auto;
        }
        .cv-export-container {
            background: white;
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        }
        .cv-premium { font-family: 'Inter', sans-serif; color: #0f172a; }
        .cv-header-premium {
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }
        .cv-name-premium { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; }
        .cv-title-premium { font-size: 0.9rem; font-weight: 500; margin-top: 0.2rem; }
        .cv-contact-line {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.7rem;
            margin-top: 0.6rem;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 0.5rem;
        }
        .cv-body-premium { padding: 1.2rem; }
        .cv-section-premium { margin-bottom: 1.2rem; }
        .cv-section-premium h3 {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            color: #2563eb;
            border-left: 3px solid;
            padding-left: 0.6rem;
        }
        .cv-job, .cv-degree { font-weight: 700; font-size: 0.9rem; }
        .cv-company, .cv-school { font-size: 0.75rem; font-weight: 500; color: #334155; }
        .cv-date { font-size: 0.65rem; color: #64748b; }
        .cv-desc { font-size: 0.73rem; color: #475569; margin-top: 0.2rem; }
        .cv-skills-tags, .cv-interests-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .cv-skill-badge, .cv-interest-badge {
            background: #eef2ff;
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .two-columns-layout { display: flex; gap: 1.2rem; }
        .two-columns-layout .sidebar { flex: 1; background-color: #f8fafc; border-radius: 0.8rem; padding: 0.5rem; }
        .two-columns-layout .main-content { flex: 2; }
        .compact-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
        
        .btn-pdf {
            background: linear-gradient(135deg, #059669, #10b981);
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 3rem;
            color: white;
            font-weight: bold;
            margin-top: 1.5rem;
            cursor: pointer;
            font-size: 1rem;
        }
        .action-buttons { display: flex; gap: 0.8rem; margin-top: 1rem; flex-wrap: wrap; }
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #0f172a;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            z-index: 2000;
        }
        [contenteditable="true"] {
            outline: none;
            cursor: text;
            background: rgba(59,130,246,0.05);
            transition: 0.1s;
            border-radius: 4px;
            padding: 0 2px;
        }
        [contenteditable="true"]:hover { background: rgba(59,130,246,0.15); }
        [contenteditable="true"]:focus { background: #dbeafe; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>📄 Simple Curriculum</h1>
        <div class="sub">Glissez-déposez • Édition directe • Export PDF</div>
    </div>

    <div class="style-panel">
        <div class="style-group"><span>🎨 Couleur en-tête :</span><div class="color-palette" id="headerColorPalette"></div></div>
        <div class="style-group"><span>🎨 Couleur colonne :</span><select id="sidebarColorSelect"><option value="#f8fafc">Gris clair</option><option value="#dbeafe">Bleu pastel</option><option value="#dcfce7">Vert pastel</option><option value="#fef9c3">Jaune pastel</option></select></div>
        <div class="style-group"><span>📐 Agencement :</span><select id="layoutSelect"><option value="classic">Classique</option><option value="two-columns">Deux colonnes</option><option value="compact">Compact</option></select></div>
        <div class="style-group"><span>✨ Design :</span><select id="designSelect"><option value="classic">Classique</option><option value="modern">Moderne</option><option value="minimal">Minimal</option><option value="professional">Pro</option><option value="futuristic">Futuriste</option></select></div>
        <div class="style-group"><span>📁 Template :</span><select id="templateSelect"><option value="standard">Standard</option><option value="skills_first">Compétences d'abord</option><option value="reverse_chrono">Chronologique inversé</option></select></div>
    </div>

    <button class="toggle-editor-btn" id="toggleEditorBtn">✏️ Masquer/Afficher l'éditeur</button>

    <div class="cv-maker">
        <div class="editor-panel" id="editorPanel">
            <div class="section-title">👤 Identité</div>
            <div class="input-group"><label>Nom complet</label><input type="text" id="fullName" placeholder="Sophie Laurent"></div>
            <div class="input-group"><label>Titre</label><input type="text" id="jobTitle" placeholder="Chef de projet"></div>
            <div class="input-group"><label>Adresse</label><input type="text" id="address" placeholder="Paris, France"></div>
            <div class="input-group"><label>Téléphone</label><input type="text" id="phone" placeholder="06 12 34 56 78"></div>
            <div class="input-group"><label>Email</label><input type="email" id="email" placeholder="nom@exemple.com"></div>
            <div class="input-group"><label>LinkedIn</label><input type="text" id="website" placeholder="linkedin.com/in/..."></div>

            <div class="section-title">💼 Expériences <span style="font-size:0.7rem;">(glisser pour réorganiser)</span></div>
            <div id="expList" class="sortable-list"></div>
            <button class="btn-add" id="addExpBtn">+ Ajouter</button>

            <div class="section-title">🎓 Formations <span style="font-size:0.7rem;">(glisser pour réorganiser)</span></div>
            <div id="eduList" class="sortable-list"></div>
            <button class="btn-add" id="addEduBtn">+ Ajouter</button>

            <div class="section-title">🧠 Compétences</div>
            <div id="skillsContainer"></div>
            <div class="add-skill"><input type="text" id="newSkillInput" placeholder="Python, Gestion de projet..."><button class="btn-add" id="addSkillBtn">Ajouter</button></div>

            <div class="section-title">🎯 Centres d'intérêt</div>
            <div id="interestsContainer"></div>
            <div class="add-interest"><input type="text" id="newInterestInput" placeholder="Voyages, Lecture..."><button class="btn-add" id="addInterestBtn">Ajouter</button></div>

            <div class="action-buttons"><button id="exportJsonBtn">💾 Exporter JSON</button><button id="importJsonBtn">📂 Importer JSON</button><input type="file" id="importFileInput" accept=".json" style="display:none"></div>
        </div>

        <div class="preview-panel">
            <div id="cvExportContainer" class="cv-export-container"><div id="cvPreview" class="cv-premium"></div></div>
            <button class="btn-pdf" id="downloadPdfBtn">📄 Télécharge ton CV (PDF)</button>
        </div>
    </div>
</div>

<script>
    // ---------- DONNÉES ----------
    let cv = {
        personal: { name: "", title: "", address: "", phone: "", email: "", website: "" },
        experiences: [],
        educations: [],
        skills: [],
        interests: []
    };
    let currentHeaderColor = "#3b82f6", currentLayout = "classic", currentDesign = "classic", currentSidebarColor = "#f8fafc", currentTemplate = "standard";
    const headerColors = ["#3b82f6", "#ef4444", "#10b981", "#f59e0b", "#8b5cf6", "#ec4898", "#06b6d4"];
    let sortableExp, sortableEdu;

    function toast(msg, isError = false) { let t = document.createElement('div'); t.className = 'toast'; t.style.background = isError ? '#b91c1c' : '#1e293b'; t.innerText = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    // Génération des sélecteurs de date (mois/année)
    function getMonthOptions(selected) {
        const months = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Juil", "Aoû", "Sep", "Oct", "Nov", "Déc"];
        return months.map(m => `<option value="${m}" ${selected === m ? 'selected' : ''}>${m}</option>`).join('');
    }
    function getYearOptions(selected) {
        const currentYear = new Date().getFullYear();
        let options = '<option value="">Année</option>';
        for(let y = currentYear + 5; y >= 1990; y--) options += `<option value="${y}" ${selected == y ? 'selected' : ''}>${y}</option>`;
        return options;
    }

    function formatDateForDisplay(dateStr) {
        if(!dateStr) return "";
        const parts = dateStr.split(' ');
        if(parts.length === 2) return parts[0] + " " + parts[1];
        return dateStr;
    }

    // Génération HTML du CV (avec édition directe)
    function generateCVHTML() {
        const headerGradient = `linear-gradient(135deg, ${currentHeaderColor}, ${currentHeaderColor}dd)`;
        const contactHtml = `<div class="cv-contact-line">${cv.personal.phone ? `<span class="cv-contact-item">📞 ${escapeHtml(cv.personal.phone)}</span>` : ''}${cv.personal.email ? `<span class="cv-contact-item">✉️ ${escapeHtml(cv.personal.email)}</span>` : ''}${cv.personal.website ? `<span class="cv-contact-item">🔗 ${escapeHtml(cv.personal.website)}</span>` : ''}${cv.personal.address ? `<span class="cv-contact-item">📍 ${escapeHtml(cv.personal.address)}</span>` : ''}</div>`;
        const headerHtml = `<div class="cv-header-premium" style="background: ${headerGradient};"><div class="cv-name-premium" contenteditable="true" data-field="name">${escapeHtml(cv.personal.name) || "Votre nom"}</div><div class="cv-title-premium" contenteditable="true" data-field="title">${escapeHtml(cv.personal.title) || "Titre professionnel"}</div>${contactHtml}</div>`;

        const makeExpSection = () => `<div class="cv-section-premium"><h3 style="border-left-color:${currentHeaderColor}">💼 Expériences</h3>${cv.experiences.map((exp, idx) => `<div data-exp-idx="${idx}" class="editable-exp"><div class="cv-job" contenteditable="true" data-exp-field="job" data-idx="${idx}">${escapeHtml(exp.job) || "Poste"}</div><div class="cv-company"><span contenteditable="true" data-exp-field="company" data-idx="${idx}">${escapeHtml(exp.company) || "Entreprise"}</span> · <span class="cv-date">${formatDateForDisplay(exp.date) || ""}</span></div><div class="cv-desc" contenteditable="true" data-exp-field="desc" data-idx="${idx}">${escapeHtml(exp.desc) || ""}</div></div>`).join('')}${!cv.experiences.length ? '<div class="cv-desc" style="opacity:0.6;">Aucune expérience</div>' : ''}</div>`;
        const makeEduSection = () => `<div class="cv-section-premium"><h3 style="border-left-color:${currentHeaderColor}">🎓 Formations</h3>${cv.educations.map((edu, idx) => `<div data-edu-idx="${idx}" class="editable-edu"><div class="cv-degree" contenteditable="true" data-edu-field="degree" data-idx="${idx}">${escapeHtml(edu.degree) || "Diplôme"}</div><div class="cv-school"><span contenteditable="true" data-edu-field="school" data-idx="${idx}">${escapeHtml(edu.school) || "Établissement"}</span> · <span class="cv-date">${formatDateForDisplay(edu.date) || ""}</span></div><div class="cv-desc" contenteditable="true" data-edu-field="desc" data-idx="${idx}">${escapeHtml(edu.desc) || ""}</div></div>`).join('')}${!cv.educations.length ? '<div class="cv-desc" style="opacity:0.6;">Aucune formation</div>' : ''}</div>`;
        const makeSkillsSection = () => `<div class="cv-section-premium"><h3 style="border-left-color:${currentHeaderColor}">🧠 Compétences</h3><div class="cv-skills-tags">${cv.skills.map(s => `<span class="cv-skill-badge">✨ ${escapeHtml(s)}</span>`).join('')}${!cv.skills.length ? '<span class="cv-desc">Aucune</span>' : ''}</div></div>`;
        const makeInterestsSection = () => `<div class="cv-section-premium"><h3 style="border-left-color:${currentHeaderColor}">🎯 Centres d'intérêt</h3><div class="cv-interests-tags">${cv.interests.map(i => `<span class="cv-interest-badge">🎯 ${escapeHtml(i)}</span>`).join('')}${!cv.interests.length ? '<span class="cv-desc">Aucun</span>' : ''}</div></div>`;

        let sectionsOrder = [];
        if(currentTemplate === "skills_first") sectionsOrder = [makeSkillsSection, makeInterestsSection, makeExpSection, makeEduSection];
        else if(currentTemplate === "reverse_chrono") {
            const revExp = [...cv.experiences].reverse(), revEdu = [...cv.educations].reverse();
            const makeRevExp = () => `<div class="cv-section-premium"><h3>💼 Expériences (récentes)</h3>${revExp.map(exp => `<div><div class="cv-job">${escapeHtml(exp.job)}</div><div class="cv-company">${escapeHtml(exp.company)} · <span class="cv-date">${exp.date}</span></div><div class="cv-desc">${escapeHtml(exp.desc)}</div></div>`).join('')}</div>`;
            const makeRevEdu = () => `<div class="cv-section-premium"><h3>🎓 Formations (récentes)</h3>${revEdu.map(edu => `<div><div class="cv-degree">${escapeHtml(edu.degree)}</div><div class="cv-school">${escapeHtml(edu.school)} · <span class="cv-date">${edu.date}</span></div><div class="cv-desc">${escapeHtml(edu.desc)}</div></div>`).join('')}</div>`;
            sectionsOrder = [makeRevExp, makeRevEdu, makeSkillsSection, makeInterestsSection];
        } else sectionsOrder = [makeExpSection, makeEduSection, makeSkillsSection, makeInterestsSection];

        let mainHTML = sectionsOrder.map(fn => fn()).join('');
        if(currentLayout === 'two-columns') mainHTML = `<div class="two-columns-layout"><div class="sidebar" style="background-color:${currentSidebarColor};">${makeSkillsSection()}${makeInterestsSection()}</div><div class="main-content">${[makeExpSection, makeEduSection].map(fn=>fn()).join('')}</div></div>`;
        else if(currentLayout === 'compact') mainHTML = `<div class="compact-layout"><div>${makeExpSection()}</div><div>${makeEduSection()}</div><div>${makeSkillsSection()}</div><div>${makeInterestsSection()}</div></div>`;

        return `<div class="cv-premium design-${currentDesign}">${headerHtml}<div class="cv-body-premium">${mainHTML}</div></div>`;
    }

    function updatePreview() {
        document.getElementById('cvPreview').innerHTML = generateCVHTML();
        attachPreviewEditableEvents();
        saveToLocalStorage();
    }

    // Édition directe dans le preview
    function attachPreviewEditableEvents() {
        document.querySelectorAll('[contenteditable="true"]').forEach(el => {
            el.removeEventListener('blur', handlePreviewEdit);
            el.addEventListener('blur', handlePreviewEdit);
        });
    }
    function handlePreviewEdit(e) {
        const target = e.target;
        const newValue = target.innerText.trim();
        if(target.dataset.field === 'name') cv.personal.name = newValue;
        else if(target.dataset.field === 'title') cv.personal.title = newValue;
        else if(target.dataset.expField) {
            const idx = parseInt(target.dataset.idx);
            if(!isNaN(idx) && cv.experiences[idx]) cv.experiences[idx][target.dataset.expField] = newValue;
        }
        else if(target.dataset.eduField) {
            const idx = parseInt(target.dataset.idx);
            if(!isNaN(idx) && cv.educations[idx]) cv.educations[idx][target.dataset.eduField] = newValue;
        }
        renderEditor();
        updatePreview();
        toast("Modifié");
    }

    // Rendu éditeur avec menus déroulants
    function renderEditor() {
        document.getElementById('fullName').value = cv.personal.name;
        document.getElementById('jobTitle').value = cv.personal.title;
        document.getElementById('address').value = cv.personal.address;
        document.getElementById('phone').value = cv.personal.phone;
        document.getElementById('email').value = cv.personal.email;
        document.getElementById('website').value = cv.personal.website;

        const expDiv = document.getElementById('expList');
        expDiv.innerHTML = '';
        cv.experiences.forEach((exp, idx) => {
            let dateParts = exp.date ? exp.date.split(' ') : ['', ''];
            let month = dateParts[0] || '', year = dateParts[1] || '';
            expDiv.innerHTML += `<div class="exp-card" data-idx="${idx}">
                <input type="text" value="${escapeHtml(exp.job)}" data-exp-field="job" placeholder="Poste">
                <input type="text" value="${escapeHtml(exp.company)}" data-exp-field="company" style="margin-top:8px" placeholder="Entreprise">
                <div class="date-select-group">
                    <select data-exp-field="month" data-idx="${idx}" class="exp-month">${getMonthOptions(month)}</select>
                    <select data-exp-field="year" data-idx="${idx}" class="exp-year">${getYearOptions(year)}</select>
                </div>
                <textarea data-exp-field="desc" rows="2" placeholder="Description">${escapeHtml(exp.desc)}</textarea>
                <button class="btn-remove" data-exp-remove="${idx}">Supprimer</button>
            </div>`;
        });

        const eduDiv = document.getElementById('eduList');
        eduDiv.innerHTML = '';
        cv.educations.forEach((edu, idx) => {
            let dateParts = edu.date ? edu.date.split(' ') : ['', ''];
            let month = dateParts[0] || '', year = dateParts[1] || '';
            eduDiv.innerHTML += `<div class="edu-card" data-idx="${idx}">
                <input type="text" value="${escapeHtml(edu.degree)}" data-edu-field="degree" placeholder="Diplôme">
                <input type="text" value="${escapeHtml(edu.school)}" data-edu-field="school" style="margin-top:8px" placeholder="Établissement">
                <div class="date-select-group">
                    <select data-edu-field="month" data-idx="${idx}" class="edu-month">${getMonthOptions(month)}</select>
                    <select data-edu-field="year" data-idx="${idx}" class="edu-year">${getYearOptions(year)}</select>
                </div>
                <textarea data-edu-field="desc" rows="2" placeholder="Description">${escapeHtml(edu.desc)}</textarea>
                <button class="btn-remove" data-edu-remove="${idx}">Supprimer</button>
            </div>`;
        });

        const skillsDiv = document.getElementById('skillsContainer');
        skillsDiv.innerHTML = '';
        cv.skills.forEach((skill, idx) => skillsDiv.innerHTML += `<div class="skill-tag">${escapeHtml(skill)} <button data-skill-remove="${idx}">✕</button></div>`);
        const interestsDiv = document.getElementById('interestsContainer');
        interestsDiv.innerHTML = '';
        cv.interests.forEach((interest, idx) => interestsDiv.innerHTML += `<div class="interest-tag">${escapeHtml(interest)} <button data-interest-remove="${idx}">✕</button></div>`);
        
        initSortable();
        attachEditorEvents();
    }

    function attachEditorEvents() {
        document.querySelectorAll('.exp-card input, .exp-card textarea').forEach(el => {
            el.removeEventListener('input', handleExpInput);
            el.addEventListener('input', handleExpInput);
        });
        document.querySelectorAll('.edu-card input, .edu-card textarea').forEach(el => {
            el.removeEventListener('input', handleEduInput);
            el.addEventListener('input', handleEduInput);
        });
        document.querySelectorAll('.exp-month, .exp-year').forEach(sel => {
            sel.removeEventListener('change', handleExpDate);
            sel.addEventListener('change', handleExpDate);
        });
        document.querySelectorAll('.edu-month, .edu-year').forEach(sel => {
            sel.removeEventListener('change', handleEduDate);
            sel.addEventListener('change', handleEduDate);
        });
        document.querySelectorAll('[data-exp-remove]').forEach(btn => btn.addEventListener('click', (e) => { cv.experiences.splice(parseInt(e.target.dataset.expRemove),1); renderEditor(); updatePreview(); toast("Supprimé"); }));
        document.querySelectorAll('[data-edu-remove]').forEach(btn => btn.addEventListener('click', (e) => { cv.educations.splice(parseInt(e.target.dataset.eduRemove),1); renderEditor(); updatePreview(); toast("Supprimé"); }));
        document.querySelectorAll('[data-skill-remove]').forEach(btn => btn.addEventListener('click', (e) => { cv.skills.splice(parseInt(e.target.dataset.skillRemove),1); renderEditor(); updatePreview(); toast("Supprimé"); }));
        document.querySelectorAll('[data-interest-remove]').forEach(btn => btn.addEventListener('click', (e) => { cv.interests.splice(parseInt(e.target.dataset.interestRemove),1); renderEditor(); updatePreview(); toast("Supprimé"); }));
    }

    function handleExpInput(e) { let card = e.target.closest('.exp-card'); if(card){ let idx = parseInt(card.dataset.idx); if(!isNaN(idx)) cv.experiences[idx][e.target.dataset.expField] = e.target.value; updatePreview(); } }
    function handleEduInput(e) { let card = e.target.closest('.edu-card'); if(card){ let idx = parseInt(card.dataset.idx); if(!isNaN(idx)) cv.educations[idx][e.target.dataset.eduField] = e.target.value; updatePreview(); } }
    function handleExpDate(e) { let card = e.target.closest('.exp-card'); if(card){ let idx = parseInt(card.dataset.idx); let month = card.querySelector('.exp-month').value; let year = card.querySelector('.exp-year').value; cv.experiences[idx].date = month && year ? month + ' ' + year : (month || year); updatePreview(); } }
    function handleEduDate(e) { let card = e.target.closest('.edu-card'); if(card){ let idx = parseInt(card.dataset.idx); let month = card.querySelector('.edu-month').value; let year = card.querySelector('.edu-year').value; cv.educations[idx].date = month && year ? month + ' ' + year : (month || year); updatePreview(); } }

    function initSortable() {
        if(sortableExp) sortableExp.destroy();
        if(sortableEdu) sortableEdu.destroy();
        sortableExp = new Sortable(document.getElementById('expList'), { animation: 200, onEnd: () => { const items = [...document.querySelectorAll('#expList .exp-card')]; const newOrder = items.map(el => parseInt(el.dataset.idx)); const reordered = newOrder.map(i => cv.experiences[i]); cv.experiences = reordered; renderEditor(); updatePreview(); toast("Ordre mis à jour"); } });
        sortableEdu = new Sortable(document.getElementById('eduList'), { animation: 200, onEnd: () => { const items = [...document.querySelectorAll('#eduList .edu-card')]; const newOrder = items.map(el => parseInt(el.dataset.idx)); const reordered = newOrder.map(i => cv.educations[i]); cv.educations = reordered; renderEditor(); updatePreview(); toast("Ordre mis à jour"); } });
    }

    function saveToLocalStorage() { localStorage.setItem('cvBuilderState', JSON.stringify({ cv, currentHeaderColor, currentLayout, currentDesign, currentSidebarColor, currentTemplate })); }
    function loadFromLocalStorage() {
        const saved = localStorage.getItem('cvBuilderState');
        if(saved) { try { const s = JSON.parse(saved); cv = s.cv; currentHeaderColor = s.currentHeaderColor || "#3b82f6"; currentLayout = s.currentLayout || "classic"; currentDesign = s.currentDesign || "classic"; currentSidebarColor = s.currentSidebarColor || "#f8fafc"; currentTemplate = s.currentTemplate || "standard"; document.getElementById('layoutSelect').value = currentLayout; document.getElementById('designSelect').value = currentDesign; document.getElementById('sidebarColorSelect').value = currentSidebarColor; document.getElementById('templateSelect').value = currentTemplate; updateSidebarSelectDisabled(); renderEditor(); updatePreview(); } catch(e){} }
    }
    function updateSidebarSelectDisabled() { let sel = document.getElementById('sidebarColorSelect'); if(currentLayout !== 'two-columns') { sel.disabled = true; sel.style.opacity = '0.5'; } else { sel.disabled = false; sel.style.opacity = '1'; } }

    function exportToJson() { const data = JSON.stringify({ cv, options: { currentHeaderColor, currentLayout, currentDesign, currentSidebarColor, currentTemplate } }, null, 2); const blob = new Blob([data], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mon-cv.json'; a.click(); URL.revokeObjectURL(blob); toast("Exporté"); }
    function importFromJson(file) { const reader = new FileReader(); reader.onload = (e) => { try { const parsed = JSON.parse(e.target.result); if(parsed.cv) { cv = parsed.cv; if(parsed.options) { currentHeaderColor = parsed.options.currentHeaderColor || currentHeaderColor; currentLayout = parsed.options.currentLayout || currentLayout; currentDesign = parsed.options.currentDesign || currentDesign; currentSidebarColor = parsed.options.currentSidebarColor || currentSidebarColor; currentTemplate = parsed.options.currentTemplate || currentTemplate; document.getElementById('layoutSelect').value = currentLayout; document.getElementById('designSelect').value = currentDesign; document.getElementById('sidebarColorSelect').value = currentSidebarColor; document.getElementById('templateSelect').value = currentTemplate; updateSidebarSelectDisabled(); } renderEditor(); updatePreview(); toast("Importé"); } else throw new Error(); } catch(err) { toast("Fichier invalide", true); } }; reader.readAsText(file); }

    // Téléchargement PDF avec html2pdf (fidèle)
    function downloadPDF() {
        const element = document.getElementById('cvExportContainer').cloneNode(true);
        element.style.transform = 'none';
        element.style.margin = '0';
        element.style.padding = '0';
        const opt = { margin: [0.5, 0.5, 0.5, 0.5], filename: `${cv.personal.name || 'CV'}_${new Date().toISOString().slice(0,10)}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, letterRendering: true, useCORS: true }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } };
        html2pdf().set(opt).from(element).save();
        toast("PDF généré !");
    }

    function initColorPalette() {
        const container = document.getElementById('headerColorPalette');
        headerColors.forEach(color => { const btn = document.createElement('div'); btn.className = 'color-option'; btn.style.backgroundColor = color; if(color === currentHeaderColor) btn.classList.add('active'); btn.addEventListener('click', () => { currentHeaderColor = color; document.querySelectorAll('.color-option').forEach(c=>c.classList.remove('active')); btn.classList.add('active'); updatePreview(); toast("Couleur changée"); }); container.appendChild(btn); });
    }

    function initEventListeners() {
        document.getElementById('fullName').addEventListener('input', (e) => { cv.personal.name = e.target.value; updatePreview(); });
        document.getElementById('jobTitle').addEventListener('input', (e) => { cv.personal.title = e.target.value; updatePreview(); });
        document.getElementById('address').addEventListener('input', (e) => { cv.personal.address = e.target.value; updatePreview(); });
        document.getElementById('phone').addEventListener('input', (e) => { cv.personal.phone = e.target.value; updatePreview(); });
        document.getElementById('email').addEventListener('input', (e) => { cv.personal.email = e.target.value; updatePreview(); });
        document.getElementById('website').addEventListener('input', (e) => { cv.personal.website = e.target.value; updatePreview(); });
        document.getElementById('addExpBtn').addEventListener('click', () => { cv.experiences.push({ job:"", company:"", date:"", desc:"" }); renderEditor(); updatePreview(); toast("Expérience ajoutée"); });
        document.getElementById('addEduBtn').addEventListener('click', () => { cv.educations.push({ degree:"", school:"", date:"", desc:"" }); renderEditor(); updatePreview(); toast("Formation ajoutée"); });
        document.getElementById('addSkillBtn').addEventListener('click', () => { let s = document.getElementById('newSkillInput').value.trim(); if(s && !cv.skills.includes(s)) { cv.skills.push(s); renderEditor(); updatePreview(); document.getElementById('newSkillInput').value=''; toast("Compétence ajoutée"); } else if(s) toast("Déjà présente", true); });
        document.getElementById('addInterestBtn').addEventListener('click', () => { let i = document.getElementById('newInterestInput').value.trim(); if(i && !cv.interests.includes(i)) { cv.interests.push(i); renderEditor(); updatePreview(); document.getElementById('newInterestInput').value=''; toast("Intérêt ajouté"); } else if(i) toast("Déjà présent", true); });
        document.getElementById('layoutSelect').addEventListener('change', (e) => { currentLayout = e.target.value; updateSidebarSelectDisabled(); updatePreview(); });
        document.getElementById('designSelect').addEventListener('change', (e) => { currentDesign = e.target.value; updatePreview(); });
        document.getElementById('sidebarColorSelect').addEventListener('change', (e) => { currentSidebarColor = e.target.value; updatePreview(); });
        document.getElementById('templateSelect').addEventListener('change', (e) => { currentTemplate = e.target.value; updatePreview(); });
        document.getElementById('downloadPdfBtn').addEventListener('click', downloadPDF);
        document.getElementById('exportJsonBtn').addEventListener('click', exportToJson);
        document.getElementById('importJsonBtn').addEventListener('click', () => document.getElementById('importFileInput').click());
        document.getElementById('importFileInput').addEventListener('change', (e) => { if(e.target.files.length) importFromJson(e.target.files[0]); e.target.value = ''; });
        const toggleBtn = document.getElementById('toggleEditorBtn'), editorPanel = document.getElementById('editorPanel');
        toggleBtn.addEventListener('click', () => { editorPanel.classList.toggle('hide-on-mobile'); toggleBtn.textContent = editorPanel.classList.contains('hide-on-mobile') ? '✏️ Afficher' : '✏️ Masquer'; });
    }

    loadFromLocalStorage();
    initColorPalette();
    initEventListeners();
    renderEditor();
    updatePreview();
    updateSidebarSelectDisabled();
</script>
</body>
</html>
