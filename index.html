<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créateur de CV ATS - Designer & Éditeur</title>
  <style>
    /* ---------- VARIABLES & RESET ---------- */
    :root {
      --bg: #f5f2ec;
      --paper: #fff;
      --side: #f0f0f0;
      --text: #111;
      --muted: #666;
      --accent: #0e5d63;
      --line: #ddd;
      --shadow: 0 12px 28px rgba(0,0,0,.08);
      --font: Arial, Helvetica, sans-serif;
    }
    body[data-theme="dark"] {
      --bg: #161616;
      --paper: #1f1f1f;
      --side: #2a2620;
      --text: #eee;
      --muted: #aaa;
      --line: #3b3b3b;
      --shadow: 0 12px 28px rgba(0,0,0,.35);
    }
    * {
      box-sizing: border-box;
      margin: 0;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      margin: 0;
      transition: background 0.2s;
    }
    button, input, textarea, select {
      font: inherit;
    }
    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    /* ---------- LAYOUT GLOBAL ---------- */
    .wrap {
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px;
    }
    /* Barre d'outils fixe */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 12px;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .title h1 {
      font-size: 22px;
      margin: 0;
    }
    .title p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn, .sel {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--text);
      transition: 0.1s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }

    /* Grille principale : éditeur + aperçu */
    .layout {
      display: grid;
      grid-template-columns: minmax(340px, 480px) minmax(0, 1fr);
      gap: 20px;
      margin-top: 20px;
    }
    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .editor {
      padding: 18px;
      max-height: calc(100vh - 120px);
      overflow: auto;
    }
    .preview {
      padding: 18px;
      position: sticky;
      top: 90px;
      height: fit-content;
    }

    /* ---------- FORMULAIRES & CARTES ---------- */
    .section {
      border-top: 1px solid #eee;
      padding-top: 16px;
      margin-top: 16px;
    }
    .section:first-child {
      border-top: none;
      padding-top: 0;
      margin-top: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .full {
      grid-column: 1/-1;
    }
    label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
    }
    body[data-theme="dark"] input,
    body[data-theme="dark"] textarea,
    body[data-theme="dark"] select {
      background: #151515;
      color: #eee;
    }
    textarea {
      min-height: 90px;
      resize: vertical;
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .card-list {
      display: grid;
      gap: 10px;
    }
    .card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fafafa;
    }
    body[data-theme="dark"] .card {
      background: #232323;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: #eef6f6;
      color: #202020;
    }
    body[data-theme="dark"] .tag {
      background: #2b3232;
      color: #fff;
    }

    /* Score ATS */
    .score {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .ring {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--accent) calc(var(--score,0)*1%), #e2e2e2 0);
    }
    .ring-in {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--paper);
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    /* ---------- AFFICHAGE CV (APERÇU) ---------- */
    .shell {
      background: #fff;
      border-radius: 20px;
      border: 1px solid #e8e8e8;
      box-shadow: var(--shadow);
      overflow: visible;
    }
    .resume {
      display: grid;
      grid-template-columns: 210px 1fr;
      min-height: 1000px;
      background: #fff;
      color: #000;
    }
    .side {
      background: var(--side);
      padding: 18px 14px;
      border-right: 1px solid #ddd;
    }
    .main {
      padding: 26px 28px;
    }
    .name {
      font-size: 34px;
      line-height: .95;
      font-weight: 700;
    }
    .role {
      margin-top: 8px;
      color: var(--accent);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .block {
      margin-top: 20px;
    }
    .label2 {
      font-size: 11px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 10px;
    }
    .list {
      display: grid;
      gap: 8px;
      font-size: 13px;
    }
    .sec2 {
      margin-bottom: 14px;
      page-break-inside: avoid;
    }
    .sec2 h3 {
      font-size: 13px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .entry {
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid #e5e5e5;
      page-break-inside: avoid;
    }
    .entry:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }
    .head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }
    .entry-title {
      font-size: 16px;
      font-weight: 700;
    }
    .entry-sub {
      font-size: 13px;
      color: #555;
      margin-top: 2px;
    }
    .entry-desc {
      margin-top: 8px;
      font-size: 14px;
      color: #2c2c2c;
      max-width: 68ch;
    }
    .badge {
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 999px;
      background: #eaf4f4;
      color: #13484b;
      font-weight: 700;
      display: inline-block;
      margin: 0 6px 6px 0;
    }
    .contact-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
      background: #f9f9f9;
      padding: 12px 14px;
      border-radius: 16px;
      margin: 16px 0 12px 0;
    }
    .section-separator {
      margin: 24px 0 20px 0;
      border: 0;
      height: 1px;
      background: var(--line);
    }

    /* Modal lettre */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 100;
    }
    .modal.open {
      display: flex;
    }
    .lm-editor {
      width: min(940px, 100%);
      height: min(88vh, 900px);
      background: var(--paper);
      border-radius: 20px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .lm-area {
      width: 100%;
      height: 100%;
      border: none;
      resize: none;
      padding: 18px;
      background: #fff;
      color: inherit;
    }
    .note {
      font-size: 12px;
      color: var(--muted);
    }
    .intro h2 {
      margin: 0;
      font-size: 30px;
    }
    .intro p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    /* Impression */
    @page {
      size: A4 portrait;
      margin: 10mm;
    }
    @media print {
      .topbar, .editor, .actions, .preview .row, .modal, .print-hide { display: none !important; }
      .layout { display: block; }
      .preview, .panel { padding: 0; border: none; box-shadow: none; }
      .shell { box-shadow: none; border: none; border-radius: 0; }
      .resume { width: 100%; min-height: auto; break-inside: avoid; background: #fff !important; grid-template-columns: 180px 1fr; }
      .side { background: var(--side) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .main { background: #fff !important; }
      .badge { background: #eaf4f4 !important; color: #13484b !important; }
      .section-separator { background: #ccc !important; margin: 20px 0 !important; }
    }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
      .preview { position: static; }
      .editor { max-height: none; }
    }
    @media (max-width: 760px) {
      .wrap { padding: 12px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .grid, .resume { grid-template-columns: 1fr; }
      .side { border-right: none; border-bottom: 1px solid #ddd; }
      .main { padding: 24px 18px; }
      .name { font-size: 32px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <!-- Barre supérieure -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">CV</div>
      <div class="title">
        <h1>Création de CV ATS</h1>
        <p>Adresse, formation et centres d’intérêts...</p>
      </div>
    </div>
    <div class="actions print-hide">
      <button class="btn" id="themeBtn">Mode sombre</button>
      <button class="btn" id="resetBtn">Réinitialiser</button>
      <button class="btn" id="demoBtn">Démo</button>
      <button class="btn" id="lmBtn">Lettre</button>
      <button class="btn btn-primary" id="printBtn">Aperçu PDF</button>
    </div>
  </header>

  <main class="layout">
    <!-- Panneau d'édition -->
    <section class="panel editor print-hide">
      <div class="intro">
        <h2>Éditeur</h2>
        <p>Créer votre cv plus intuitif.</p>
      </div>

      <!-- Template -->
      <div class="section">
        <div class="grid">
          <div class="field full">
            <label>Template</label>
            <select id="layoutSel" class="sel">
              <option value="split">Deux Colonnes</option>
              <option value="classic">Classic</option>
              <option value="minimal">Minimal</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Infos personnelles -->
      <div class="section">
        <div class="grid">
          <div class="field full"><label>Nom</label><input id="name" type="text"></div>
          <div class="field full"><label>Titre</label><input id="title" type="text"></div>
          <div class="field"><label>Téléphone</label><input id="phone" type="text"></div>
          <div class="field"><label>Email</label><input id="email" type="email"></div>
          <div class="field full"><label>Adresse</label><input id="address" type="text"></div>
          <div class="field full"><label>Résumé</label><textarea id="summary"></textarea></div>
        </div>
      </div>

      <!-- Expériences -->
      <div class="section">
        <div class="row" style="justify-content:space-between">
          <strong>Expériences</strong>
          <button class="btn btn-primary" id="addExp">+ Ajouter</button>
        </div>
        <div id="expList" class="card-list" style="margin-top:10px"></div>
      </div>

      <!-- Formations -->
      <div class="section">
        <div class="row" style="justify-content:space-between">
          <strong>Formations</strong>
          <button class="btn btn-primary" id="addEdu">+ Ajouter</button>
        </div>
        <div id="eduList" class="card-list" style="margin-top:10px"></div>
      </div>

      <!-- Compétences -->
      <div class="section">
        <div class="row"><strong>Compétences</strong></div>
        <div id="skillsList" class="tag-list" style="margin-top:10px"></div>
        <div class="row" style="margin-top:10px">
          <input id="skillInput" type="text" placeholder="Ex: Gestion, Scrum">
          <button class="btn" id="addSkill">Ajouter</button>
        </div>
      </div>

      <!-- Centres d'intérêt -->
      <div class="section">
        <div class="row"><strong>Centres d’intérêt</strong></div>
        <div id="interestList" class="tag-list" style="margin-top:10px"></div>
        <div class="row" style="margin-top:10px">
          <input id="interestInput" type="text" placeholder="Ex: Lecture, vélo">
          <button class="btn" id="addInterest">Ajouter</button>
        </div>
      </div>

      <!-- Score ATS -->
      <div class="section">
        <div class="row"><strong>Score ATS</strong></div>
        <div class="score" style="margin-top:10px">
          <div class="ring" id="ring" style="--score:0"><div class="ring-in" id="score">0</div></div>
          <div class="note" id="scoreText">Remplissez les champs pour augmenter le score.</div>
        </div>
      </div>
    </section>

    <!-- Zone d'aperçu -->
    <aside class="panel preview">
      <div class="row print-hide" style="justify-content:space-between; margin-bottom:10px">
        <strong>Aperçu</strong>
        <span class="note">Aperçu avant impression</span>
      </div>
      <div class="shell">
        <div id="resumePreview"></div>
      </div>
    </aside>
  </main>
</div>

<!-- Modal Lettre de motivation -->
<div class="modal" id="lmModal">
  <div class="lm-editor">
    <div class="modal-head">
      <div><strong>Lettre de motivation</strong><div class="note">Modifiable et imprimable</div></div>
      <div class="modal-actions">
        <button class="btn" id="genLmBtn">Générer</button>
        <button class="btn btn-primary" id="printLmBtn">Imprimer</button>
        <button class="btn" id="closeLmBtn">Fermer</button>
      </div>
    </div>
    <textarea id="lmArea" class="lm-area"></textarea>
  </div>
</div>

<script>
  // --------------------------------------------------------------
  // 1. DONNÉES DE DÉMONSTRATION & STOCKAGE
  // --------------------------------------------------------------
  const DEMO_DATA = {
    personal: {
      name: 'Sophie Laurent',
      title: 'Cheffe de projet digital',
      phone: '06 11 22 33 44',
      email: 'sophie.laurent@mail.com',
      address: '34 rue des Flandres, 59000 Lille, France',
      summary: 'Cheffe de projet digitale avec 6 ans d’expérience, spécialisée dans la coordination d’équipes, la conduite de projets web et l’optimisation des parcours clients. Habituée aux environnements agiles, elle pilote des projets multi-intervenants, structure les priorités et améliore la performance opérationnelle.'
    },
    experiences: [
      { job: 'Cheffe de projet digital', company: 'Agence Nova', desc: 'Pilotage de 8 projets web, coordination UX/UI, suivi client, animation des ateliers de cadrage et amélioration des délais de livraison de 25%.' },
      { job: 'Product owner junior', company: 'E-commerce Nord', desc: 'Recueil des besoins métier, rédaction des user stories, priorisation du backlog et suivi des sprints Scrum avec les équipes produit et technique.' },
      { job: 'Assistante communication', company: 'Studio Pixel', desc: 'Gestion des contenus, mise à jour du site vitrine, préparation des supports commerciaux et coordination avec les prestataires graphiques.' }
    ],
    educations: [
      { degree: 'Master Marketing digital', school: 'IAE Lille', desc: 'Spécialisation en gestion de projet, stratégie omnicanale et analyse de la performance digitale.' },
      { degree: 'Licence Information-communication', school: 'Université de Lille', desc: 'Formation centrée sur la communication de projet, la rédaction professionnelle et la conduite d’entretiens.' }
    ],
    skills: ['Gestion de projet', 'Scrum', 'UX', 'Notion', 'Figma', 'Reporting', 'Organisation', 'Communication'],
    interests: ['Design', 'Voyage', 'Lecture', 'Cinéma', 'Course à pied']
  };

  const STORAGE_KEY = 'cv_react_style_v2';

  // État global
  let appState = {
    layout: 'split',
    cv: JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || structuredClone(DEMO_DATA),
    theme: 'light'
  };

  // Utilitaires DOM
  const $ = (selector) => document.querySelector(selector);
  const escapeHtml = (str) => String(str || '').replace(/[&<>"']/g, (m) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
  }[m]));

  // Sauvegarde locale
  function persistToLocalStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.cv));
  }

  // --------------------------------------------------------------
  // 2. LOGIQUE MÉTIER : SCORE ATS, RENDU HTML
  // --------------------------------------------------------------
  function computeAtsScore() {
    const cv = appState.cv;
    let score = 0;
    if (cv.personal.name) score += 10;
    if (cv.personal.title) score += 10;
    if (cv.personal.email) score += 10;
    cv.experiences.forEach(exp => {
      if ((exp.desc || '').length > 80) score += 10;
      if (/gestion|pilotage|analyse|projet/i.test(exp.desc || '')) score += 10;
    });
    cv.educations.forEach(edu => {
      if ((edu.desc || '').length > 50) score += 5;
    });
    score += cv.skills.length * 5;
    score += cv.interests.length * 2;
    return Math.min(score, 100);
  }

  // Affiche une entrée (expérience ou formation)
  function renderEntry(item) {
    const title = item.job || item.degree;
    const subtitle = item.company || item.school;
    return `
      <div class="entry">
        <div class="head">
          <div>
            <div class="entry-title">${escapeHtml(title)}</div>
            <div class="entry-sub">${escapeHtml(subtitle)}</div>
          </div>
        </div>
        <div class="entry-desc">${escapeHtml(item.desc)}</div>
      </div>
    `;
  }

  // Bloc contact stylisé (pour templates classic/minimal)
  function renderContactBlock(personal) {
    const items = [];
    if (personal.phone) items.push(`📞 ${escapeHtml(personal.phone)}`);
    if (personal.email) items.push(`✉️ ${escapeHtml(personal.email)}`);
    if (personal.address) items.push(`📍 ${escapeHtml(personal.address)}`);
    if (items.length === 0) return '';
    return `<div class="contact-grid">${items.join(' • ')}</div>`;
  }

  // Générateur d'aperçu selon le template
  function renderPreview() {
    const cv = appState.cv;
    const p = cv.personal;
    const skillsHtml = cv.skills.map(s => `<span class="badge">${escapeHtml(s)}</span>`).join('');
    const interestsHtml = cv.interests.map(i => `<span class="badge">${escapeHtml(i)}</span>`).join('');
    const contactHtml = renderContactBlock(p);

    const experiencesHtml = cv.experiences.map(renderEntry).join('') || '<div class="entry-desc">Ajoutez vos expériences.</div>';
    const educationsHtml = cv.educations.map(renderEntry).join('') || '<div class="entry-desc">Ajoutez vos formations.</div>';
    const separator = '<hr class="section-separator">';

    if (appState.layout === 'split') {
      // Deux colonnes
      const preview = `
        <section class="resume">
          <div class="side">
            <h1 class="name">${escapeHtml(p.name) || 'Votre nom'}</h1>
            <div class="role">${escapeHtml(p.title) || 'Titre professionnel'}</div>
            <div class="block"><div class="label2">Contact</div><div class="list">${escapeHtml(p.phone || '')}<br>${escapeHtml(p.email || '')}<br>${escapeHtml(p.address || '')}</div></div>
            <div class="block"><div class="label2">Résumé</div><div class="entry-desc">${escapeHtml(p.summary || '')}</div></div>
            <div class="block"><div class="label2">Compétences</div>${skillsHtml || '<div class="entry-sub">Aucune compétence</div>'}</div>
            <div class="block"><div class="label2">Centres d’intérêt</div>${interestsHtml || '<div class="entry-sub">Aucun centre d’intérêt</div>'}</div>
          </div>
          <div class="main">
            <section class="sec2"><h3>Expériences</h3>${experiencesHtml}</section>
            ${separator}
            <section class="sec2"><h3>Formations</h3>${educationsHtml}</section>
          </div>
        </section>
      `;
      $('#resumePreview').innerHTML = preview;
    } 
    else if (appState.layout === 'classic') {
      // Classique : tout en large, avec contact enrichi
      const preview = `
        <section class="resume" style="grid-template-columns:1fr">
          <div class="main" style="padding-top:0">
            <h1 class="name" style="font-size:46px">${escapeHtml(p.name) || 'Votre nom'}</h1>
            <div class="role">${escapeHtml(p.title) || 'Titre professionnel'}</div>
            ${contactHtml}
            <div class="entry-desc" style="margin-top:10px">${escapeHtml(p.summary || '')}</div>
            <section class="sec2"><h3>Expériences</h3>${experiencesHtml}</section>
            ${separator}
            <section class="sec2"><h3>Formations</h3>${educationsHtml}</section>
            <section class="sec2"><h3>Compétences</h3>${skillsHtml || '<div class="entry-sub">Aucune compétence</div>'}</section>
            <section class="sec2"><h3>Centres d’intérêt</h3>${interestsHtml || '<div class="entry-sub">Aucun centre d’intérêt</div>'}</section>
          </div>
        </section>
      `;
      $('#resumePreview').innerHTML = preview;
    } 
    else {
      // Minimal : affiche toutes les sections (contact, compétences, loisirs)
      const preview = `
        <section class="resume" style="grid-template-columns:1fr">
          <div class="main" style="padding-top:0">
            <h1 class="name" style="font-size:46px">${escapeHtml(p.name) || 'Votre nom'}</h1>
            <div class="role">${escapeHtml(p.title) || 'Titre professionnel'}</div>
            ${contactHtml}
            <div class="entry-desc" style="margin-top:10px; margin-bottom:20px;">${escapeHtml(p.summary || '')}</div>
            <section class="sec2"><h3>Expériences</h3>${experiencesHtml}</section>
            ${separator}
            <section class="sec2"><h3>Formations</h3>${educationsHtml}</section>
            <section class="sec2"><h3>Compétences</h3>${skillsHtml || '<div class="entry-sub">Aucune compétence</div>'}</section>
            <section class="sec2"><h3>Centres d’intérêt</h3>${interestsHtml || '<div class="entry-sub">Aucun centre d’intérêt</div>'}</section>
          </div>
        </section>
      `;
      $('#resumePreview').innerHTML = preview;
    }

    // Mise à jour du score ATS
    const ats = computeAtsScore();
    $('#score').textContent = ats;
    $('#ring').style.setProperty('--score', ats / 100);
    $('#scoreText').textContent = `Score ATS : ${ats}%`;
    persistToLocalStorage();
  }

  // --------------------------------------------------------------
  // 3. SYNCHRONISATION ÉDITEUR ↔ STATE
  // --------------------------------------------------------------
  function refreshEditorFromState() {
    const cv = appState.cv;
    $('#layoutSel').value = appState.layout;
    $('#name').value = cv.personal.name || '';
    $('#title').value = cv.personal.title || '';
    $('#phone').value = cv.personal.phone || '';
    $('#email').value = cv.personal.email || '';
    $('#address').value = cv.personal.address || '';
    $('#summary').value = cv.personal.summary || '';

    // Expériences
    const expContainer = $('#expList');
    expContainer.innerHTML = '';
    cv.experiences.forEach((exp, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.i = idx;
      card.innerHTML = `
        <div class="field"><label>Poste</label><input data-k="job" value="${escapeHtml(exp.job)}"></div>
        <div class="field"><label>Entreprise</label><input data-k="company" value="${escapeHtml(exp.company)}"></div>
        <div class="field"><label>Description</label><textarea data-k="desc">${escapeHtml(exp.desc)}</textarea></div>
      `;
      expContainer.appendChild(card);
    });

    // Formations
    const eduContainer = $('#eduList');
    eduContainer.innerHTML = '';
    cv.educations.forEach((edu, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.i = idx;
      card.innerHTML = `
        <div class="field"><label>Diplôme</label><input data-k="degree" value="${escapeHtml(edu.degree)}"></div>
        <div class="field"><label>École</label><input data-k="school" value="${escapeHtml(edu.school)}"></div>
        <div class="field"><label>Description</label><textarea data-k="desc">${escapeHtml(edu.desc)}</textarea></div>
      `;
      eduContainer.appendChild(card);
    });

    // Compétences (tags avec suppression)
    $('#skillsList').innerHTML = cv.skills.map((s, i) => `<span class="tag">${escapeHtml(s)} <button data-rm-skill="${i}">×</button></span>`).join('');
    $('#interestList').innerHTML = cv.interests.map((h, i) => `<span class="tag">${escapeHtml(h)} <button data-rm-int="${i}">×</button></span>`).join('');

    // Bind dynamique sur les cartes (expériences et formations)
    document.querySelectorAll('#expList .card input, #expList .card textarea').forEach(input => {
      input.oninput = (e) => {
        const card = e.target.closest('.card');
        const idx = parseInt(card.dataset.i);
        const key = e.target.dataset.k;
        appState.cv.experiences[idx][key] = e.target.value;
        renderPreview();
      };
    });
    document.querySelectorAll('#eduList .card input, #eduList .card textarea').forEach(input => {
      input.oninput = (e) => {
        const card = e.target.closest('.card');
        const idx = parseInt(card.dataset.i);
        const key = e.target.dataset.k;
        appState.cv.educations[idx][key] = e.target.value;
        renderPreview();
      };
    });

    // Suppression compétences / centres
    document.querySelectorAll('[data-rm-skill]').forEach(btn => {
      btn.onclick = () => {
        appState.cv.skills.splice(parseInt(btn.dataset.rmSkill), 1);
        renderPreview();
      };
    });
    document.querySelectorAll('[data-rm-int]').forEach(btn => {
      btn.onclick = () => {
        appState.cv.interests.splice(parseInt(btn.dataset.rmInt), 1);
        renderPreview();
      };
    });
  }

  // --------------------------------------------------------------
  // 4. GESTION DES ÉVÉNEMENTS & INITIALISATION
  // --------------------------------------------------------------
  function bindEvents() {
    // Thème clair/sombre
    $('#themeBtn').onclick = () => {
      appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
      document.body.dataset.theme = appState.theme;
      $('#themeBtn').textContent = appState.theme === 'dark' ? 'Mode clair' : 'Mode sombre';
    };

    // Changement de template
    $('#layoutSel').onchange = (e) => {
      appState.layout = e.target.value;
      renderPreview();
    };

    // Champs personnels
    ['name', 'title', 'phone', 'email', 'address', 'summary'].forEach(id => {
      $(`#${id}`).oninput = (e) => {
        appState.cv.personal[id] = e.target.value;
        renderPreview();
      };
    });

    // Ajout d'expérience / formation
    $('#addExp').onclick = () => {
      appState.cv.experiences.push({ job: 'Nouveau poste', company: 'Entreprise', desc: '' });
      renderPreview();
    };
    $('#addEdu').onclick = () => {
      appState.cv.educations.push({ degree: 'Diplôme', school: 'Établissement', desc: '' });
      renderPreview();
    };

    // Compétences
    $('#addSkill').onclick = () => {
      const val = $('#skillInput').value.trim();
      if (val) {
        appState.cv.skills.push(val);
        $('#skillInput').value = '';
        renderPreview();
      }
    };
    $('#skillInput').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#addSkill').click(); } };

    // Centres d'intérêt
    $('#addInterest').onclick = () => {
      const val = $('#interestInput').value.trim();
      if (val) {
        appState.cv.interests.push(val);
        $('#interestInput').value = '';
        renderPreview();
      }
    };
    $('#interestInput').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#addInterest').click(); } };

    // Boutons reset & demo
    $('#resetBtn').onclick = () => {
      appState.cv = structuredClone(DEMO_DATA);
      appState.layout = 'split';
      appState.theme = 'light';
      document.body.dataset.theme = 'light';
      $('#themeBtn').textContent = 'Mode sombre';
      renderPreview();
    };
    $('#demoBtn').onclick = () => {
      appState.cv = structuredClone(DEMO_DATA);
      renderPreview();
    };

    // Lettre de motivation
    function generateLetterText() {
      const p = appState.cv.personal;
      return `Objet : Candidature au poste de ${p.title || 'votre poste'}\n\nMadame, Monsieur,\n\nJe vous adresse ma candidature pour le poste de ${p.title || 'votre poste'}. Mon expérience en gestion de projet, coordination d’équipes et amélioration des parcours clients me permet de contribuer rapidement à vos objectifs.\n\nCordialement,\n${p.name || 'Votre nom'}`;
    }
    $('#lmBtn').onclick = () => {
      $('#lmArea').value = generateLetterText();
      $('#lmModal').classList.add('open');
    };
    $('#genLmBtn').onclick = () => { $('#lmArea').value = generateLetterText(); };
    $('#printLmBtn').onclick = () => {
      const win = window.open('', '_blank');
      win.document.write(`<pre style="white-space:pre-wrap;font:16px Arial;padding:24px">${escapeHtml($('#lmArea').value)}</pre>`);
      win.document.close();
      win.print();
    };
    $('#closeLmBtn').onclick = () => $('#lmModal').classList.remove('open');
    $('#lmModal').onclick = (e) => { if (e.target.id === 'lmModal') $('#lmModal').classList.remove('open'); };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#lmModal').classList.remove('open'); });

    // Impression du CV
    $('#printBtn').onclick = () => window.print();
  }

  // Lancement
  function init() {
    bindEvents();
    document.body.dataset.theme = appState.theme;
    $('#themeBtn').textContent = appState.theme === 'dark' ? 'Mode clair' : 'Mode sombre';
    renderPreview();
    refreshEditorFromState(); // double synchro initiale
  }

  init();
</script>
</body>
</html>
