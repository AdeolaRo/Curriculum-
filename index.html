<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CV Builder</title>

  <link rel="stylesheet" href="css/styles.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

<div class="app">

  <h1>📄 CV Builder</h1>

  <div class="container">

    <!-- EDITOR -->
    <div class="editor">

      <h2>Infos</h2>
      <input id="name" placeholder="Nom complet">
      <input id="title" placeholder="Titre">
      <input id="email" placeholder="Email">

      <h2>Compétences</h2>
      <div class="row">
        <input id="skillInput" placeholder="Ajouter compétence">
        <button id="addSkill">+</button>
      </div>
      <div id="skills"></div>

      <h2>Expérience</h2>
      <button id="addExp">Ajouter expérience</button>
      <div id="experiences"></div>

    </div>

    <!-- PREVIEW -->
    <div class="preview">
      <div id="cv"></div>
      <button id="download">📄 Télécharger PDF</button>
    </div>

  </div>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
