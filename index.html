<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Simple Curriculum | Création CV </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 2rem;
            color: #f1f5f9;
        }

        .app {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            background: linear-gradient(135deg, #e0e7ff, #a78bfa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .sub {
            opacity: 0.75;
            font-weight: 300;
        }

        /* Panneau de styles */
        .style-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 1rem 1.8rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .style-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .color-palette {
            display: flex;
            gap: 0.6rem;
        }
        .color-option {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .color-option.active {
            border-color: white;
            transform: scale(1.1);
        }
        select, .sidebar-color-select {
            padding: 0.5rem 1.2rem;
            border-radius: 3rem;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            font-family: inherit;
            cursor: pointer;
        }
        select option, .sidebar-color-select option {
            background: #1e293b;
            color: white;
        }

        /* Layout 2 colonnes */
        .cv-maker {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        @media (max-width: 900px) {
            body { padding: 1rem; }
            .cv-maker { grid-template-columns: 1fr; }
        }

        /* Éditeur */
        .editor-panel {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border-radius: 1.8rem;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 1.2rem 0 0.8rem 0;
            border-left: 4px solid #a78bfa;
            padding-left: 0.75rem;
            font-family: 'Playfair Display', serif;
        }
        .section-title:first-of-type { margin-top: 0; }
        .input-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-weight: 500;
            font-size: 0.8rem;
            margin-bottom: 0.3rem;
            color: #cbd5f5;
        }
        input, textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: white;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #a78bfa;
            background: rgba(255,255,255,0.18);
        }
        .exp-card, .edu-card {
            background: rgba(255,255,255,0.08);
            border-radius: 1.2rem;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 3px solid #8b5cf6;
        }
        .btn-add {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            margin: 0.5rem 0;
        }
        .btn-remove {
            background: rgba(239, 68, 68, 0.8);
            border: none;
            color: white;
            padding: 0.2rem 0.9rem;
            border-radius: 1.5rem;
            cursor: pointer;
            margin-top: 0.5rem;
            font-size: 0.7rem;
        }
        .skills-container, .interests-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin: 1rem 0;
        }
        .skill-tag, .interest-tag {
            background: rgba(139, 92, 246, 0.3);
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            display: inline-flex;
            gap: 0.6rem;
            align-items: center;
            font-size: 0.8rem;
        }
        .skill-tag button, .interest-tag button {
            background: none;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .add-skill, .add-interest {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }
        .add-skill input, .add-interest input {
            flex: 1;
        }

        /* Aperçu CV */
        .preview-panel {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border-radius: 1.8rem;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.15);
            position: sticky;
            top: 2rem;
            max-height: 90vh;
            overflow-y: auto;
        }
        .cv-export-container {
            background: white;
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.3);
        }
        .cv-premium {
            font-family: 'Inter', sans-serif;
            color: #0f172a;
        }
        /* En-tête */
        .cv-header-premium {
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }
        .cv-name-premium {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
        }
        .cv-title-premium {
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 0.2rem;
        }
        .cv-contact-line {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.7rem;
            margin-top: 0.6rem;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 0.5rem;
        }
        .cv-contact-item {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .cv-body-premium {
            padding: 1.2rem;
        }
        .cv-section-premium {
            margin-bottom: 1.2rem;
        }
        .cv-section-premium h3 {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            color: #4f46e5;
            border-left: 3px solid;
            padding-left: 0.6rem;
        }
        .cv-job, .cv-degree {
            font-weight: 700;
            font-size: 0.9rem;
        }
        .cv-company, .cv-school {
            font-size: 0.75rem;
            font-weight: 500;
            color: #334155;
        }
        .cv-date {
            font-size: 0.65rem;
            color: #64748b;
        }
        .cv-desc {
            font-size: 0.73rem;
            color: #475569;
            margin-top: 0.2rem;
        }
        .cv-skills-tags, .cv-interests-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .cv-skill-badge, .cv-interest-badge {
            background: #eef2ff;
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #1e293b;
        }
        /* Layouts */
        .two-columns-layout {
            display: flex;
            gap: 1.2rem;
        }
        .two-columns-layout .sidebar {
            flex: 1;
            background-color: #f8fafc; /* couleur par défaut, sera remplacée dynamiquement */
            border-radius: 0.8rem;
            padding: 0.5rem;
        }
        .two-columns-layout .main-content {
            flex: 2;
        }
        .compact-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }
        .btn-print {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 3rem;
            color: white;
            font-weight: bold;
            margin-top: 1.5rem;
            cursor: pointer;
            font-size: 1rem;
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1e293b;
            backdrop-filter: blur(10px);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            z-index: 2000;
        }
        /* Variantes de design */
        .design-modern .cv-header-premium { border-radius: 0; border-bottom: 3px solid rgba(255,255,255,0.3); }
        .design-shadow .cv-export-container { box-shadow: 0 25px 40px -12px black; }
        .design-minimal .cv-section-premium h3 { font-weight: 500; text-transform: none; letter-spacing: 0; }
        .design-professional .cv-header-premium { background: linear-gradient(135deg, #1e293b, #334155); }
        .design-futuristic .cv-header-premium { background: linear-gradient(135deg, #ec4898, #8b5cf6, #06b6d4); }
        /* Impression */
        
       @media print {
    body {
        background: white;
        padding: 0;
    }

    .editor-panel,
    .style-panel,
    .btn-print,
    .toast {
        display: none;
    }

    .preview-panel {
        position: static;
        max-height: none;
        overflow: visible;
        background: transparent;
        backdrop-filter: none;
        padding: 0;
    }

    .cv-export-container {
        width: 100%;
        margin: 0;
        border-radius: 0;
        box-shadow: none;
    }

    .cv-premium {
        width: 100%;
    }

    .cv-header-premium,
    .two-columns-layout .sidebar,
    .cv-skill-badge,
    .cv-interest-badge {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
}
        @page {
    size: A4;
    margin: 10mm;
}
        
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>📄 Simple Curriculum</h1>
        <div class="sub">Éditeur complet • Aperçu en temps réel • Impression PDF fidèle</div>
    </div>

    <div class="style-panel">
        <div class="style-group">
            <span>🎨 Couleur en-tête :</span>
            <div class="color-palette" id="headerColorPalette"></div>
        </div>
        <div class="style-group">
            <span>🎨 Couleur colonne gauche (2 colonnes) :</span>
            <select id="sidebarColorSelect" class="sidebar-color-select">
                <option value="#f8fafc">Gris clair (défaut)</option>
                <option value="#dbeafe">Bleu pastel</option>
                <option value="#dcfce7">Vert pastel</option>
                <option value="#fef9c3">Jaune pastel</option>
            </select>
        </div>
        <div class="style-group">
            <span>📐 Agencement :</span>
            <select id="layoutSelect">
                <option value="classic">Classique (stacké)</option>
                <option value="two-columns">Deux colonnes (sidebar)</option>
                <option value="compact">Très compact</option>
            </select>
        </div>
        <div class="style-group">
            <span>✨ Design :</span>
            <select id="designSelect">
                <option value="classic">Classique</option>
                <option value="modern">Moderne</option>
                <option value="shadow">Ombre intense</option>
                <option value="minimal">Minimal</option>
                <option value="professional">Pro élégant</option>
                <option value="futuristic">Futuriste</option>
            </select>
        </div>
    </div>

    <div class="cv-maker">
        <!-- Éditeur - TOUT EST VIDE -->
        <div class="editor-panel">
            <div class="section-title">👤 Identité & Contact</div>
            <div class="input-group"><label>Nom complet</label><input type="text" id="fullName" placeholder="ex: Sophie Laurent" value=""></div>
            <div class="input-group"><label>Titre professionnel</label><input type="text" id="jobTitle" placeholder="ex: Chef de projet digital" value=""></div>
            <div class="input-group"><label>Adresse</label><input type="text" id="address" placeholder="ex: 12 rue de Paris, 75000" value=""></div>
            <div class="input-group"><label>📞 Téléphone</label><input type="text" id="phone" placeholder="06 12 34 56 78" value=""></div>
            <div class="input-group"><label>✉️ E-mail</label><input type="email" id="email" placeholder="nom@exemple.com" value=""></div>
            <div class="input-group"><label>🔗 LinkedIn / site web</label><input type="text" id="website" placeholder="https://linkedin.com/in/..." value=""></div>

            <div class="section-title">💼 Expériences</div>
            <div id="expList"></div>
            <button class="btn-add" id="addExpBtn">+ Ajouter une expérience</button>

            <div class="section-title">🎓 Formations</div>
            <div id="eduList"></div>
            <button class="btn-add" id="addEduBtn">+ Ajouter une formation</button>

            <div class="section-title">🧠 Compétences</div>
            <div id="skillsContainer" class="skills-container"></div>
            <div class="add-skill">
                <input type="text" id="newSkillInput" placeholder="Ex: Gestion de projet, Python">
                <button class="btn-add" id="addSkillBtn">Ajouter</button>
            </div>

            <div class="section-title">🎯 Centres d'intérêt</div>
            <div id="interestsContainer" class="interests-container"></div>
            <div class="add-interest">
                <input type="text" id="newInterestInput" placeholder="Ex: Voyages, Lecture">
                <button class="btn-add" id="addInterestBtn">Ajouter</button>
            </div>
        </div>

        <!-- Aperçu + impression -->
        <div class="preview-panel">
            <div id="cvExportContainer" class="cv-export-container">
                <div id="cvPreview" class="cv-premium"></div>
            </div>
            <button class="btn-print" id="printBtn">🖨️ Imprimer / Générer PDF (aperçu exact)</button>
        </div>
    </div>
</div>

<script>
    // Structure de données entièrement vide
    let cv = {
        personal: { name: "", title: "", address: "", phone: "", email: "", website: "" },
        experiences: [],
        educations: [],
        skills: [],
        interests: []
    };

    let currentHeaderColor = "#3b82f6";
    let currentLayout = "classic";
    let currentDesign = "classic";
    let currentSidebarColor = "#f8fafc"; // gris clair par défaut
    const headerColors = ["#3b82f6", "#ef4444", "#10b981", "#f59e0b", "#8b5cf6", "#ec4898", "#06b6d4", "#84cc16", "#f97316", "#6366f1"];

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    // Génération du CV sans badge, avec couleur de sidebar pour deux colonnes
    function generateCVHTML() {
        cv.personal.name = document.getElementById('fullName').value;
        cv.personal.title = document.getElementById('jobTitle').value;
        cv.personal.address = document.getElementById('address').value;
        cv.personal.phone = document.getElementById('phone').value;
        cv.personal.email = document.getElementById('email').value;
        cv.personal.website = document.getElementById('website').value;

        const headerGradient = `linear-gradient(135deg, ${currentHeaderColor}, ${currentHeaderColor}dd)`;
        const contactHtml = `
            <div class="cv-contact-line">
                ${cv.personal.phone ? `<span class="cv-contact-item">📞 ${escapeHtml(cv.personal.phone)}</span>` : ''}
                ${cv.personal.email ? `<span class="cv-contact-item">✉️ ${escapeHtml(cv.personal.email)}</span>` : ''}
                ${cv.personal.website ? `<span class="cv-contact-item">🔗 ${escapeHtml(cv.personal.website)}</span>` : ''}
                <span class="cv-contact-item">📍 ${escapeHtml(cv.personal.address)}</span>
            </div>
        `;

        const headerHtml = `
            <div class="cv-header-premium" style="background: ${headerGradient};">
                <div class="cv-name-premium">${escapeHtml(cv.personal.name) || "Votre nom"}</div>
                <div class="cv-title-premium">${escapeHtml(cv.personal.title) || "Titre professionnel"}</div>
                ${contactHtml}
            </div>
        `;

        const expHtml = `<div class="cv-section-premium"><h3 style="border-left-color:${currentHeaderColor}">💼 Expériences</h3>${cv.experiences.map(exp => `
            <div style="margin-bottom:0.7rem;"><div class="cv-job">${escapeHtml(exp.job) || "Poste"}</div>
            <div class="cv-company">${escapeHtml(exp.company) || "Entreprise"} · <span class="cv-date">${escapeHtml(exp.date) || ""}</span></div>
            <div class="cv-desc">${escapeHtml(exp.desc) || ""}</div></div>
        `).join('')}${cv.experiences.length === 0 ? '<div class="cv-desc" style="opacity:0.6;">Aucune expérience renseignée</div>' : ''}</div>`;
        
        const eduHtml = `<div class="cv-section-premium"><h3 style="border-left-color:${currentHeaderColor}">🎓 Formations</h3>${cv.educations.map(edu => `
            <div style="margin-bottom:0.7rem;"><div class="cv-degree">${escapeHtml(edu.degree) || "Diplôme"}</div>
            <div class="cv-school">${escapeHtml(edu.school) || "Établissement"} · <span class="cv-date">${escapeHtml(edu.date) || ""}</span></div>
            <div class="cv-desc">${escapeHtml(edu.desc) || ""}</div></div>
        `).join('')}${cv.educations.length === 0 ? '<div class="cv-desc" style="opacity:0.6;">Aucune formation renseignée</div>' : ''}</div>`;
        
        const skillsHtml = `<div class="cv-section-premium"><h3 style="border-left-color:${currentHeaderColor}">🧠 Compétences</h3><div class="cv-skills-tags">${cv.skills.map(s => `<span class="cv-skill-badge">✨ ${escapeHtml(s)}</span>`).join('')}${cv.skills.length === 0 ? '<span class="cv-desc" style="opacity:0.6;">Aucune compétence</span>' : ''}</div></div>`;
        const interestsHtml = `<div class="cv-section-premium"><h3 style="border-left-color:${currentHeaderColor}">🎯 Centres d'intérêt</h3><div class="cv-interests-tags">${cv.interests.map(i => `<span class="cv-interest-badge">🎯 ${escapeHtml(i)}</span>`).join('')}${cv.interests.length === 0 ? '<span class="cv-desc" style="opacity:0.6;">Aucun centre d’intérêt</span>' : ''}</div></div>`;

        let mainContent = '';
        if(currentLayout === 'two-columns') {
            // Appliquer la couleur de fond choisie à la sidebar
            mainContent = `
                <div class="two-columns-layout">
                    <div class="sidebar" style="background-color: ${currentSidebarColor};">${skillsHtml}${interestsHtml}</div>
                    <div class="main-content">${expHtml}${eduHtml}</div>
                </div>
            `;
        } else if(currentLayout === 'compact') {
            mainContent = `
                <div class="compact-layout">
                    <div>${expHtml}</div>
                    <div>${eduHtml}</div>
                    <div>${skillsHtml}</div>
                    <div>${interestsHtml}</div>
                </div>
            `;
        } else { // classic
            mainContent = `${expHtml}${eduHtml}${skillsHtml}${interestsHtml}`;
        }

        return `<div id="cvInner" class="cv-premium">${headerHtml}<div class="cv-body-premium">${mainContent}</div></div>`;
    }

    function updatePreview() {
        const rawHtml = generateCVHTML();
        document.getElementById('cvPreview').innerHTML = rawHtml;
        const wrapper = document.getElementById('cvPreview');
        if(wrapper) wrapper.className = `cv-premium design-${currentDesign}`;
        // Appliquer dynamiquement le style pour le design futuriste/pro
        let styleTag = document.getElementById('dynamic-design-style');
        if(!styleTag){ styleTag = document.createElement('style'); styleTag.id = 'dynamic-design-style'; document.head.appendChild(styleTag); }
        let extraCss = '';
        if(currentDesign === 'futuristic') extraCss = `.design-futuristic .cv-skill-badge, .design-futuristic .cv-interest-badge { background: linear-gradient(135deg, #e0e7ff, #f3e8ff); }`;
        else if(currentDesign === 'professional') extraCss = `.design-professional .cv-header-premium { background: linear-gradient(135deg, #1e293b, #2d3a4e) !important; }`;
        styleTag.textContent = extraCss;
    }

    // Rendu de l'éditeur (listes vides au départ)
    function renderEditor() {
        document.getElementById('fullName').value = cv.personal.name;
        document.getElementById('jobTitle').value = cv.personal.title;
        document.getElementById('address').value = cv.personal.address;
        document.getElementById('phone').value = cv.personal.phone;
        document.getElementById('email').value = cv.personal.email;
        document.getElementById('website').value = cv.personal.website;

        const expDiv = document.getElementById('expList');
        expDiv.innerHTML = '';
        cv.experiences.forEach((exp, idx) => {
            expDiv.innerHTML += `
                <div class="exp-card">
                    <input type="text" value="${escapeHtml(exp.job)}" data-exp-index="${idx}" data-field="job" placeholder="Poste">
                    <input type="text" value="${escapeHtml(exp.company)}" data-exp-index="${idx}" data-field="company" style="margin-top:8px" placeholder="Entreprise">
                    <input type="text" value="${escapeHtml(exp.date)}" data-exp-index="${idx}" data-field="date" style="margin-top:8px" placeholder="Date">
                    <textarea data-exp-index="${idx}" data-field="desc" rows="2" placeholder="Description">${escapeHtml(exp.desc)}</textarea>
                    <button class="btn-remove" data-exp-remove="${idx}">Supprimer</button>
                </div>
            `;
        });

        const eduDiv = document.getElementById('eduList');
        eduDiv.innerHTML = '';
        cv.educations.forEach((edu, idx) => {
            eduDiv.innerHTML += `
                <div class="edu-card">
                    <input type="text" value="${escapeHtml(edu.degree)}" data-edu-index="${idx}" data-field="degree" placeholder="Diplôme">
                    <input type="text" value="${escapeHtml(edu.school)}" data-edu-index="${idx}" data-field="school" style="margin-top:8px" placeholder="Établissement">
                    <input type="text" value="${escapeHtml(edu.date)}" data-edu-index="${idx}" data-field="date" style="margin-top:8px" placeholder="Année">
                    <textarea data-edu-index="${idx}" data-field="desc" rows="2" placeholder="Description">${escapeHtml(edu.desc)}</textarea>
                    <button class="btn-remove" data-edu-remove="${idx}">Supprimer</button>
                </div>
            `;
        });

        const skillsDiv = document.getElementById('skillsContainer');
        skillsDiv.innerHTML = '';
        cv.skills.forEach((skill, idx) => {
            skillsDiv.innerHTML += `<div class="skill-tag">${escapeHtml(skill)} <button data-skill-remove="${idx}">✕</button></div>`;
        });

        const interestsDiv = document.getElementById('interestsContainer');
        interestsDiv.innerHTML = '';
        cv.interests.forEach((interest, idx) => {
            interestsDiv.innerHTML += `<div class="interest-tag">${escapeHtml(interest)} <button data-interest-remove="${idx}">✕</button></div>`;
        });
        attachDynamicEvents();
    }

    function attachDynamicEvents() {
        document.querySelectorAll('.exp-card input, .exp-card textarea').forEach(el => {
            el.removeEventListener('input', handleExpChange);
            el.addEventListener('input', handleExpChange);
        });
        document.querySelectorAll('[data-exp-remove]').forEach(btn => btn.addEventListener('click', handleExpRemove));
        document.querySelectorAll('.edu-card input, .edu-card textarea').forEach(el => {
            el.removeEventListener('input', handleEduChange);
            el.addEventListener('input', handleEduChange);
        });
        document.querySelectorAll('[data-edu-remove]').forEach(btn => btn.addEventListener('click', handleEduRemove));
        document.querySelectorAll('[data-skill-remove]').forEach(btn => btn.addEventListener('click', handleSkillRemove));
        document.querySelectorAll('[data-interest-remove]').forEach(btn => btn.addEventListener('click', handleInterestRemove));
    }

    function handleExpChange(e) {
        const idx = parseInt(e.target.dataset.expIndex);
        const field = e.target.dataset.field;
        if (!isNaN(idx)) cv.experiences[idx][field] = e.target.value;
        updatePreview();
    }
    function handleExpRemove(e) {
        const idx = parseInt(e.target.dataset.expRemove);
        cv.experiences.splice(idx,1); renderEditor(); updatePreview(); toast("Expérience supprimée");
    }
    function handleEduChange(e) {
        const idx = parseInt(e.target.dataset.eduIndex);
        const field = e.target.dataset.field;
        if (!isNaN(idx)) cv.educations[idx][field] = e.target.value;
        updatePreview();
    }
    function handleEduRemove(e) {
        const idx = parseInt(e.target.dataset.eduRemove);
        cv.educations.splice(idx,1); renderEditor(); updatePreview(); toast("Formation supprimée");
    }
    function handleSkillRemove(e) {
        const idx = parseInt(e.target.dataset.skillRemove);
        cv.skills.splice(idx,1); renderEditor(); updatePreview(); toast("Compétence supprimée");
    }
    function handleInterestRemove(e) {
        const idx = parseInt(e.target.dataset.interestRemove);
        cv.interests.splice(idx,1); renderEditor(); updatePreview(); toast("Centre d'intérêt supprimé");
    }

    // Impression identique à l'aperçu
    function printCV() {
         window.print();}`;
        const printContent = document.getElementById('cvExportContainer').cloneNode(true);
        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
            <html>
                <head>
                    <title>Simple Curriculum - ${cv.personal.name || 'CV'}</title>
                    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
                    <style>
                        * { margin: 0; padding: 0; box-sizing: border-box; }
                        body { font-family: 'Inter', sans-serif; padding: 0.5in; background: white; }
                        .cv-export-container { max-width: 100%; margin: 0 auto; box-shadow: none; }
                        .cv-header-premium { background: linear-gradient(135deg, ${currentHeaderColor}, ${currentHeaderColor}dd) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                        .two-columns-layout .sidebar { background-color: ${currentSidebarColor} !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                        .cv-skill-badge, .cv-interest-badge { background: #eef2ff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                        .btn-print, .style-panel, .editor-panel, .preview-panel .btn-print, .toast { display: none; }
                    </style>
                </head>
                <body>
                    ${printContent.outerHTML}
                    <script>
                        window.onload = () => {
                            window.print();
                            setTimeout(() => window.close(), 500);
                        };
                    <\/script>
                </body>
            </html>
        `);
        printWindow.document.close();
        document.title = originalTitle;
    }

    function toast(msg) { let t = document.createElement('div'); t.className='toast'; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }

    function initColorPalette() {
        const container = document.getElementById('headerColorPalette');
        headerColors.forEach(color => {
            const btn = document.createElement('div');
            btn.className = 'color-option';
            btn.style.backgroundColor = color;
            if(color === currentHeaderColor) btn.classList.add('active');
            btn.addEventListener('click', () => {
                currentHeaderColor = color;
                document.querySelectorAll('.color-option').forEach(c=>c.classList.remove('active'));
                btn.classList.add('active');
                updatePreview();
                toast("Couleur d'en-tête modifiée");
            });
            container.appendChild(btn);
        });
    }

    function initSidebarColor() {
        const select = document.getElementById('sidebarColorSelect');
        select.value = currentSidebarColor;
        select.addEventListener('change', (e) => {
            currentSidebarColor = e.target.value;
            updatePreview();
            toast("Couleur de la colonne gauche modifiée");
        });
    }

    // Événements
    document.getElementById('addExpBtn').addEventListener('click',()=>{ cv.experiences.push({ job:"", company:"", date:"", desc:"" }); renderEditor(); updatePreview(); });
    document.getElementById('addEduBtn').addEventListener('click',()=>{ cv.educations.push({ degree:"", school:"", date:"", desc:"" }); renderEditor(); updatePreview(); });
    document.getElementById('addSkillBtn').addEventListener('click',()=>{ let s=document.getElementById('newSkillInput').value.trim(); if(s && !cv.skills.includes(s)){ cv.skills.push(s); renderEditor(); updatePreview(); document.getElementById('newSkillInput').value=''; toast("Compétence ajoutée"); } });
    document.getElementById('addInterestBtn').addEventListener('click',()=>{ let i=document.getElementById('newInterestInput').value.trim(); if(i && !cv.interests.includes(i)){ cv.interests.push(i); renderEditor(); updatePreview(); document.getElementById('newInterestInput').value=''; toast("Centre d'intérêt ajouté"); } });
    document.getElementById('printBtn').addEventListener('click', printCV);
    document.getElementById('layoutSelect').addEventListener('change',e=>{ currentLayout=e.target.value; updatePreview(); });
    document.getElementById('designSelect').addEventListener('change',e=>{ currentDesign=e.target.value; updatePreview(); });
    ['fullName','jobTitle','address','phone','email','website'].forEach(id=>document.getElementById(id).addEventListener('input',()=>updatePreview()));

    initColorPalette();
    initSidebarColor();
    renderEditor();
    updatePreview();
</script>
