<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créateur de CV ATS - Designer & Éditeur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ---------- VARIABLES & RESET ---------- */
    :root {
      --bg0: #f4f1ff;
      --bg1: #f0fdf9;
      --bg: #f6f4fb;
      --paper: rgba(255,255,255,.92);
      --side: #f0f0f0;
      --text: #14121a;
      --muted: #5f5c6a;
      --accent: #3d2a6d;
      --accent2: #0e5d63;
      --line: rgba(20,18,26,.1);
      --shadow: 0 18px 50px rgba(25,15,60,.1);
      --shadow-sm: 0 8px 24px rgba(25,15,60,.08);
      --radius: 20px;
      --font: "Manrope", system-ui, -apple-system, Segoe UI, sans-serif;
      --cv-font: Arial, Helvetica, sans-serif;
    }
    body[data-theme="dark"] {
      --bg0: #0f0e14;
      --bg1: #0c1212;
      --bg: #121118;
      --paper: rgba(30,28,38,.94);
      --side: #2a2620;
      --text: #f3f1fa;
      --muted: #a9a4ba;
      --line: rgba(255,255,255,.12);
      --shadow: 0 22px 60px rgba(0,0,0,.45);
      --shadow-sm: 0 10px 28px rgba(0,0,0,.35);
      --accent: #c4b5fd;
      --accent2: #5eead4;
    }
    * {
      box-sizing: border-box;
      margin: 0;
    }
    body {
      font-family: var(--font);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      transition: background 0.25s, color 0.2s;
      background:
        radial-gradient(1200px 700px at 12% -10%, rgba(124, 58, 237, 0.14), transparent 55%),
        radial-gradient(900px 600px at 92% 0%, rgba(13, 148, 136, 0.12), transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1));
    }
    body[data-theme="dark"] {
      background:
        radial-gradient(900px 500px at 10% -8%, rgba(124, 58, 237, 0.18), transparent 55%),
        radial-gradient(700px 500px at 95% 5%, rgba(45, 212, 191, 0.1), transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1));
    }
    button, input, textarea, select {
      font: inherit;
    }
    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    /* ---------- LAYOUT GLOBAL ---------- */
    .wrap {
      max-width: 1500px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      position: sticky;
      top: 14px;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(140deg, var(--accent2), #3730a3);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: -0.03em;
      box-shadow: 0 10px 22px rgba(14, 93, 99, 0.28);
    }
    .title h1 {
      font-size: 22px;
      margin: 0;
    }
    .title p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn, .sel {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.55);
      color: var(--text);
      transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    body[data-theme="dark"] .btn,
    body[data-theme="dark"] .sel {
      background: rgba(40,38,52,.65);
    }
    .btn:hover, .sel:hover {
      border-color: rgba(14, 93, 99, 0.35);
      box-shadow: 0 6px 18px rgba(25,15,60,.08);
      transform: translateY(-1px);
    }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible, .sel:focus-visible {
      outline: 2px solid var(--accent2);
      outline-offset: 2px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent2), #0a4d52);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 10px 24px rgba(14, 93, 99, 0.28);
    }
    .btn-primary:hover {
      box-shadow: 0 12px 30px rgba(14, 93, 99, 0.35);
      border-color: transparent;
    }

    /* Grille principale : éditeur + aperçu */
    .layout {
      display: grid;
      grid-template-columns: minmax(340px, 480px) minmax(0, 1fr);
      gap: 22px;
      margin-top: 22px;
      align-items: start;
    }
    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .editor {
      padding: 22px;
      max-height: calc(100vh - 120px);
      overflow: auto;
    }
    .preview {
      padding: 22px;
      position: sticky;
      top: 96px;
      height: fit-content;
    }

    /* ---------- FORMULAIRES & CARTES ---------- */
    .section {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      margin-top: 18px;
    }
    .section:first-child {
      border-top: none;
      padding-top: 0;
      margin-top: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .full {
      grid-column: 1/-1;
    }
    label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
    }
    body[data-theme="dark"] input,
    body[data-theme="dark"] textarea,
    body[data-theme="dark"] select {
      background: #151515;
      color: #eee;
    }
    textarea {
      min-height: 90px;
      resize: vertical;
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .card-list {
      display: grid;
      gap: 10px;
    }
    .card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.55);
    }
    body[data-theme="dark"] .card {
      background: rgba(36,34,48,.75);
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(14, 93, 99, 0.1);
      color: var(--text);
      border: 1px solid rgba(14, 93, 99, 0.15);
    }
    body[data-theme="dark"] .tag {
      background: rgba(94, 234, 212, 0.1);
      border-color: rgba(94, 234, 212, 0.2);
      color: #fff;
    }
    .tag button {
      opacity: 0.65;
      font-size: 16px;
      line-height: 1;
      padding: 0 2px;
    }
    .tag button:hover { opacity: 1; color: #b91c1c; }

    /* Score ATS */
    .score {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .ring {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--accent2) calc(var(--score,0)*1%), rgba(20,18,26,.12) 0);
    }
    .ring-in {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--paper);
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    /* ---------- Aperçu CV : typo ATS + couleurs d’écran (--cv-*) ---------- */
    .shell {
      --cv-accent: #0e5d63;
      --cv-link: #0a4f54;
      --cv-side: #eef2f4;
      --cv-border: #e2e8f0;
      --cv-soft: rgba(14, 93, 99, 0.08);
      background: #fff;
      border-radius: 22px;
      border: 1px solid rgba(20,18,26,.08);
      box-shadow: var(--shadow);
      overflow: visible;
    }
    /* Palettes sur #resumePreview = parent direct du CV → héritage fiable (Classic / Minimal) */
    #resumePreview.cv-skin-flow-0 { --cv-accent: #0e5d63; --cv-link: #0a4f54; --cv-side: #f1f5f9; --cv-border: #e2e8f0; --cv-soft: rgba(14,93,99,.14); }
    #resumePreview.cv-skin-flow-1 { --cv-accent: #1e3a5f; --cv-link: #172554; --cv-side: #f1f5f9; --cv-border: #e2e8f0; --cv-soft: rgba(30,58,95,.14); }
    #resumePreview.cv-skin-flow-2 { --cv-accent: #6b21a8; --cv-link: #4c1d95; --cv-side: #faf5ff; --cv-border: #ede9fe; --cv-soft: rgba(107,33,168,.16); }
    #resumePreview.cv-skin-flow-3 { --cv-accent: #166534; --cv-link: #14532d; --cv-side: #f0fdf4; --cv-border: #dcfce7; --cv-soft: rgba(22,101,52,.14); }
    #resumePreview.cv-skin-flow-4 { --cv-accent: #9a3412; --cv-link: #7c2d12; --cv-side: #fff7ed; --cv-border: #ffedd5; --cv-soft: rgba(154,52,18,.16); }
    #resumePreview.cv-skin-flow-5 { --cv-accent: #0f766e; --cv-link: #115e59; --cv-side: #f0fdfa; --cv-border: #ccfbf1; --cv-soft: rgba(15,118,110,.14); }

    #resumePreview.cv-skin-split-0 { --cv-accent: #0e5d63; --cv-link: #0a4f54; --cv-side: #e8f4f5; --cv-border: #cfe8e8; --cv-soft: rgba(14,93,99,.14); }
    #resumePreview.cv-skin-split-1 { --cv-accent: #3730a3; --cv-link: #312e81; --cv-side: #e8e9f6; --cv-border: #d4d6f5; --cv-soft: rgba(55,48,163,.14); }
    #resumePreview.cv-skin-split-2 { --cv-accent: #9d174d; --cv-link: #831843; --cv-side: #fce7f3; --cv-border: #fbcfe8; --cv-soft: rgba(157,23,77,.16); }
    #resumePreview.cv-skin-split-3 { --cv-accent: #3f6212; --cv-link: #365314; --cv-side: #ecfccb; --cv-border: #d9f99d; --cv-soft: rgba(63,98,18,.16); }
    #resumePreview.cv-skin-split-4 { --cv-accent: #b45309; --cv-link: #92400e; --cv-side: #fef3c7; --cv-border: #fde68a; --cv-soft: rgba(180,83,9,.16); }
    #resumePreview.cv-skin-split-5 { --cv-accent: #44403c; --cv-link: #292524; --cv-side: #e7e5e4; --cv-border: #d6d3d1; --cv-soft: rgba(68,64,60,.14); }

    .resume {
      display: grid;
      grid-template-columns: 210px 1fr;
      grid-template-rows: minmax(min-content, 1fr);
      align-items: stretch;
      min-height: 1000px;
      padding-top: 12px;
      box-sizing: border-box;
      background: #fff;
      color: #111;
      font-family: var(--cv-font);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    /* Fond colonne gauche = hauteur du bloc CV (évite bande blanche sous la sidebar) */
    .resume:has(aside.side) {
      background: linear-gradient(90deg, var(--cv-side) 210px, #fff 210px);
    }
    .resume:has(aside.side) .side {
      background: transparent;
    }
    /* Classic & Minimal : bandeau teinté en tête + un peu d’air */
    .resume.resume--flow {
      padding-top: 22px;
      padding-left: 6px;
      padding-right: 6px;
      background: linear-gradient(180deg, var(--cv-soft) 0%, #ffffff min(220px, 45%));
    }
    .resume a {
      color: var(--cv-link);
      text-decoration: none;
    }
    .resume a:hover { text-decoration: underline; }
    .side {
      background: var(--cv-side);
      padding: 18px 14px;
      border-right: 1px solid var(--cv-border);
      align-self: stretch;
      min-height: 100%;
    }
    .main {
      padding: 26px 28px;
    }
    .name {
      font-size: 34px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .role {
      margin-top: 8px;
      color: var(--cv-accent);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .block {
      margin-top: 20px;
    }
    .label2 {
      font-size: 11px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 10px;
    }
    .resume .label2 {
      color: rgba(0, 0, 0, 0.55);
    }
    .list {
      display: grid;
      gap: 8px;
      font-size: 13px;
    }
    .contact-lines {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
    }
    .contact-lines li {
      margin-bottom: 4px;
    }
    .contact-lines .lbl {
      font-weight: 700;
      color: #333;
      margin-right: 6px;
    }
    .sec2 {
      margin-bottom: 14px;
      page-break-inside: avoid;
    }
    .sec2 h2 {
      font-size: 13px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--cv-accent);
      margin: 0 0 12px 0;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--cv-accent);
      font-weight: 700;
    }
    .entry {
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #e8e8e8;
      page-break-inside: avoid;
    }
    .entry:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px 14px;
      flex-wrap: wrap;
    }
    .head > div:first-child {
      flex: 1 1 160px;
      min-width: 0;
    }
    .entry-title {
      font-size: 16px;
      font-weight: 700;
    }
    .entry-sub {
      font-size: 13px;
      color: #444;
      margin-top: 2px;
    }
    .entry-period {
      font-size: 12px;
      font-weight: 600;
      color: #333;
      text-align: right;
      flex: 0 1 auto;
      min-width: 0;
      max-width: min(100%, 240px);
      white-space: normal;
      line-height: 1.35;
      overflow-wrap: anywhere;
      hyphens: manual;
    }
    .entry-period time {
      font-weight: 600;
    }
    .entry-desc {
      margin-top: 8px;
      font-size: 13.5px;
      color: #2c2c2c;
      max-width: 68ch;
    }
    .badge {
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 999px;
      background: #eaf4f4;
      color: #13484b;
      font-weight: 700;
      display: inline-block;
      margin: 0 6px 6px 0;
    }
    .skill-list,
    .interest-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
    }
    .skill-list li,
    .interest-list li {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 0;
      border-bottom: 1px solid transparent;
    }
    .skill-list li::before,
    .interest-list li::before {
      content: "• ";
      color: var(--cv-accent);
      font-weight: 700;
    }
    .contact-grid {
      font-size: 13px;
      background: var(--cv-soft);
      padding: 14px 16px;
      border-radius: 12px;
      margin: 16px 0 12px 0;
      border: 1px solid var(--cv-border);
      border-left: 3px solid var(--cv-accent);
    }
    .contact-grid .contact-lines {
      font-size: 13px;
    }
    .section-separator {
      margin: 24px 0 20px 0;
      border: 0;
      height: 1px;
      background: var(--cv-border);
      opacity: 0.85;
    }

    /* Modal lettre */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 100;
    }
    .modal.open {
      display: flex;
    }
    .lm-editor {
      width: min(940px, 100%);
      height: min(88vh, 900px);
      background: var(--paper);
      border-radius: 20px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .lm-area {
      width: 100%;
      height: 100%;
      border: none;
      resize: none;
      padding: 18px;
      background: #fff;
      color: inherit;
    }
    body[data-theme="dark"] .lm-area {
      background: #151515;
      color: #eee;
    }
    .note {
      font-size: 12px;
      color: var(--muted);
    }
    .intro h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .intro p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    /* Palettes CV (écran uniquement — PDF neutralisé plus bas) */
    .palette-block { margin-top: 4px; }
    .palette-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .palette-swatches {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }
    .swatch {
      width: 100%;
      aspect-ratio: 1;
      max-width: 44px;
      margin: 0 auto;
      border-radius: 50%;
      border: 2px solid transparent;
      padding: 0;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      box-shadow: 0 6px 14px rgba(25,15,60,.12);
    }
    .swatch:hover { transform: scale(1.06); }
    .swatch:focus-visible {
      outline: 2px solid var(--accent2);
      outline-offset: 3px;
    }
    .swatch[aria-pressed="true"] {
      border-color: var(--text);
      box-shadow: 0 0 0 3px rgba(14, 93, 99, 0.25);
    }
    body[data-theme="dark"] .swatch[aria-pressed="true"] {
      box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.25);
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .date-row .field label {
      font-size: 10px;
    }
    .chk-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
    }
    .chk-row input {
      width: auto;
    }

    /* Impression / PDF */
    @page {
      size: A4 portrait;
      margin: 12mm 14mm;
    }
    @media print {
      body {
        background: #fff !important;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      .topbar, .editor, .actions, .preview .row, .modal, .print-hide { display: none !important; }
      .layout { display: block; margin: 0; }
      .wrap { max-width: none; padding: 0; }
      .preview, .panel { padding: 0 !important; border: none !important; box-shadow: none !important; }
      .shell {
        box-shadow: none;
        border: none;
        border-radius: 0;
        max-width: 210mm;
        margin: 0 auto;
      }
      #resumePreview {
        --cv-accent: #000 !important;
        --cv-link: #000 !important;
        --cv-side: #ededed !important;
        --cv-border: #ccc !important;
        --cv-soft: #f3f3f3 !important;
      }
      .resume {
        width: 100%;
        min-height: auto;
        break-inside: avoid;
        color: #000 !important;
        grid-template-columns: 32% 1fr;
        font-size: 10.5pt;
        line-height: 1.42;
      }
      .resume:not(:has(aside.side)) {
        background: #fff !important;
      }
      .resume:has(aside.side) {
        background: linear-gradient(90deg, #ededed 32%, #fff 32%) !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .resume:has(aside.side) .side {
        background: transparent !important;
      }
      .resume a { color: #000 !important; text-decoration: none !important; }
      .resume a:hover { text-decoration: none !important; }
      .resume .role { color: #000 !important; }
      .resume .sec2 h2 {
        color: #000 !important;
        border-bottom-color: #000 !important;
        font-size: 9.5pt;
        margin-bottom: 8px;
      }
      .resume .skill-list li::before,
      .resume .interest-list li::before { color: #000 !important; }
      .side {
        padding: 14px 12px !important;
        border-right: 1px solid #ccc !important;
      }
      .resume:not(:has(aside.side)) .side {
        background: #ededed !important;
      }
      .main { padding: 18px 20px !important; background: #fff !important; }
      .name { font-size: 22pt; line-height: 1.08; }
      .role { font-size: 9.5pt; }
      .entry-title { font-size: 11.5pt; }
      .entry-sub, .entry-desc { font-size: 10pt; }
      .entry-period { font-size: 9.5pt; }
      .label2 { font-size: 8pt; }
      .list, .contact-lines { font-size: 9.5pt; }
      .contact-grid {
        background: #f3f3f3 !important;
        border: 1px solid #ccc !important;
        border-left: 3px solid #666 !important;
      }
      .badge {
        background: #e8f2f2 !important;
        color: #0d3d40 !important;
        border: 1px solid #cfe4e4;
        font-size: 8.5pt;
        padding: 3px 8px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .skill-list li, .interest-list li { font-size: 9pt; }
      .section-separator {
        background: #bbb !important;
        margin: 14px 0 !important;
        height: 1px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .entry { page-break-inside: avoid; orphans: 3; widows: 3; }
      .sec2 { page-break-inside: avoid; }
      a[href^="mailto:"], a[href^="tel:"] { color: #000 !important; text-decoration: none; }
    }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
      .preview { position: static; }
      .editor { max-height: none; }
    }
    @media (max-width: 760px) {
      .wrap { padding: 12px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .grid, .resume { grid-template-columns: 1fr; }
      .resume:has(aside.side) {
        background: #fff;
      }
      .resume:has(aside.side) .side {
        background: var(--cv-side);
      }
      .side { border-right: none; border-bottom: 1px solid #ddd; }
      .main { padding: 24px 18px; }
      .name { font-size: 32px; }
      .palette-swatches { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
<div class="wrap">
  <!-- Barre supérieure -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">CV</div>
      <div class="title">
        <h1>Création de CV ATS</h1>
        <p>Création de CV ATS Friendly</p>
      </div>
    </div>
    <div class="actions print-hide">
      <button class="btn" id="themeBtn">Mode sombre</button>
      <button class="btn" id="resetBtn">Réinitialiser</button>
      <button class="btn" id="demoBtn">Démo</button>
      <button class="btn" id="lmBtn">Lettre</button>
      <button class="btn btn-primary" id="printBtn">Aperçu PDF</button>
    </div>
  </header>

  <main class="layout">
    <!-- Panneau d'édition -->
    <section class="panel editor print-hide">
      <div class="intro">
        <h2>Éditeur</h2>
      </div>

      <!-- Template -->
      <div class="section">
        <div class="grid">
          <div class="field full">
            <label>Template</label>
            <select id="layoutSel" class="sel">
              <option value="split">Deux Colonnes</option>
              <option value="classic">Classic</option>
              <option value="minimal">Minimal</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Couleurs CV (aperçu écran) -->
      <div class="section">
        <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <strong>Couleurs du CV</strong>
        </div>
        <div class="palette-block" id="paletteFlowBlock" hidden>
          <div class="palette-swatches" id="paletteFlowSwatches" role="group" aria-label="Palettes une colonne"></div>
        </div>
        <div class="palette-block" id="paletteSplitBlock">
          <div class="palette-label">Deux colonnes</div>
          <div class="palette-swatches" id="paletteSplitSwatches" role="group" aria-label="Palettes deux colonnes"></div>
        </div>
      </div>

      <!-- Infos personnelles -->
      <div class="section">
        <div class="grid">
          <div class="field full"><label>Nom</label><input id="name" type="text"></div>
          <div class="field full"><label>Titre</label><input id="title" type="text"></div>
          <div class="field"><label>Téléphone</label><input id="phone" type="text"></div>
          <div class="field"><label>Email</label><input id="email" type="email"></div>
          <div class="field full"><label>Adresse</label><input id="address" type="text"></div>
          <div class="field full"><label>Résumé</label><textarea id="summary"></textarea></div>
        </div>
      </div>

      <!-- Expériences -->
      <div class="section">
        <div class="row" style="justify-content:space-between">
          <strong>Expériences</strong>
          <button class="btn btn-primary" id="addExp">+ Ajouter</button>
        </div>
        <div id="expList" class="card-list" style="margin-top:10px"></div>
      </div>

      <!-- Formations -->
      <div class="section">
        <div class="row" style="justify-content:space-between">
          <strong>Formations</strong>
          <button class="btn btn-primary" id="addEdu">+ Ajouter</button>
        </div>
        <div id="eduList" class="card-list" style="margin-top:10px"></div>
      </div>

      <!-- Compétences -->
      <div class="section">
        <div class="row"><strong>Compétences</strong></div>
        <div id="skillsList" class="tag-list" style="margin-top:10px"></div>
        <div class="row" style="margin-top:10px">
          <input id="skillInput" type="text" placeholder="Ex: Gestion, Scrum">
          <button class="btn" id="addSkill">Ajouter</button>
        </div>
      </div>

      <!-- Centres d'intérêt -->
      <div class="section">
        <div class="row"><strong>Centres d’intérêt</strong></div>
        <div id="interestList" class="tag-list" style="margin-top:10px"></div>
        <div class="row" style="margin-top:10px">
          <input id="interestInput" type="text" placeholder="Ex: Lecture, vélo">
          <button class="btn" id="addInterest">Ajouter</button>
        </div>
      </div>

      <!-- Score ATS -->
      <div class="section">
        <div class="row"><strong>Score ATS</strong></div>
        <div class="score" style="margin-top:10px">
          <div class="ring" id="ring" style="--score:0"><div class="ring-in" id="score">0</div></div>
          <div class="note" id="scoreText">Remplissez les champs pour augmenter le score.</div>
        </div>
      </div>
    </section>

    <!-- Zone d'aperçu -->
    <aside class="panel preview">
      <div class="row print-hide" style="justify-content:space-between; margin-bottom:10px">
        <strong>Aperçu</strong>
        <span class="note">Aperçu avant impression</span>
      </div>
      <div class="shell">
        <div id="resumePreview"></div>
      </div>
    </aside>
  </main>
</div>

<!-- Modal Lettre de motivation -->
<div class="modal" id="lmModal">
  <div class="lm-editor">
    <div class="modal-head">
      <div><strong>Lettre de motivation</strong><div class="note">Modifiable et imprimable</div></div>
      <div class="modal-actions">
        <button class="btn" id="genLmBtn">Générer</button>
        <button class="btn btn-primary" id="printLmBtn">Imprimer</button>
        <button class="btn" id="closeLmBtn">Fermer</button>
      </div>
    </div>
    <textarea id="lmArea" class="lm-area"></textarea>
  </div>
</div>

<script>
  // --------------------------------------------------------------
  // 1. DONNÉES DE DÉMONSTRATION & STOCKAGE
  // --------------------------------------------------------------
  const MONTHS_FR = [
    '', 'janvier', 'février', 'mars', 'avril', 'mai', 'juin',
    'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'
  ];

  const EMPTY_CV = {
    personal: { name: '', title: '', phone: '', email: '', address: '', summary: '' },
    experiences: [],
    educations: [],
    skills: [],
    interests: []
  };

  const DEMO_DATA = {
    personal: {
      name: 'Sophie Laurent',
      title: 'Cheffe de projet digital',
      phone: '06 11 22 33 44',
      email: 'sophie.laurent@mail.com',
      address: '34 rue des Flandres, 59000 Lille, France',
      summary: 'Cheffe de projet digitale avec 6 ans d’expérience, spécialisée dans la coordination d’équipes, la conduite de projets web et l’optimisation des parcours clients. Habituée aux environnements agiles, elle pilote des projets multi-intervenants, structure les priorités et améliore la performance opérationnelle.'
    },
    experiences: [
      { job: 'Cheffe de projet digital', company: 'Agence Nova', startMonth: 4, startYear: 2021, endMonth: '', endYear: '', current: true, desc: 'Pilotage de 8 projets web, coordination UX/UI, suivi client, animation des ateliers de cadrage et amélioration des délais de livraison de 25%.' },
      { job: 'Product owner junior', company: 'E-commerce Nord', startMonth: 9, startYear: 2019, endMonth: 3, endYear: 2021, current: false, desc: 'Recueil des besoins métier, rédaction des user stories, priorisation du backlog et suivi des sprints Scrum avec les équipes produit et technique.' },
      { job: 'Assistante communication', company: 'Studio Pixel', startMonth: 1, startYear: 2018, endMonth: 8, endYear: 2019, current: false, desc: 'Gestion des contenus, mise à jour du site vitrine, préparation des supports commerciaux et coordination avec les prestataires graphiques.' }
    ],
    educations: [
      { degree: 'Master Marketing digital', school: 'IAE Lille', startMonth: 9, startYear: 2016, endMonth: 6, endYear: 2018, current: false, desc: 'Spécialisation en gestion de projet, stratégie omnicanale et analyse de la performance digitale.' },
      { degree: 'Licence Information-communication', school: 'Université de Lille', startMonth: 9, startYear: 2013, endMonth: 6, endYear: 2016, current: false, desc: 'Formation centrée sur la communication de projet, la rédaction professionnelle et la conduite d’entretiens.' }
    ],
    skills: ['Gestion de projet', 'Scrum', 'UX', 'Notion', 'Figma', 'Reporting', 'Organisation', 'Communication'],
    interests: ['Design', 'Voyage', 'Lecture', 'Cinéma', 'Course à pied']
  };

  const STORAGE_KEY = 'cv_react_style_v4';
  const STORAGE_KEY_LEGACY_V3 = 'cv_react_style_v3';
  const STORAGE_KEY_LEGACY_V2 = 'cv_react_style_v2';

  function loadBundleFromStorage() {
    const keys = [STORAGE_KEY, STORAGE_KEY_LEGACY_V3, STORAGE_KEY_LEGACY_V2];
    for (const key of keys) {
      const raw = localStorage.getItem(key);
      if (!raw) continue;
      try {
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') continue;
        if (parsed.cv && typeof parsed.cv === 'object') {
          return {
            cv: parsed.cv,
            layout: parsed.layout,
            theme: parsed.theme,
            paletteFlow: parsed.paletteFlow,
            paletteSplit: parsed.paletteSplit
          };
        }
        if (parsed.personal) {
          return { cv: parsed, layout: 'split', theme: 'light', paletteFlow: 0, paletteSplit: 0 };
        }
      } catch {
        /* ignore */
      }
    }
    return null;
  }

  function clampPaletteIndex(n) {
    const x = Number(n);
    if (Number.isNaN(x)) return 0;
    return Math.min(5, Math.max(0, Math.round(x)));
  }

  function normalizeCv(raw) {
    const blank = structuredClone(EMPTY_CV);
    const src = raw && typeof raw === 'object' ? raw : blank;
    const personal = { ...blank.personal, ...(src.personal || {}) };
    const mapExp = (e) => ({
      job: e.job ?? '',
      company: e.company ?? '',
      desc: e.desc ?? '',
      startMonth: e.startMonth === '' || e.startMonth == null ? '' : Number(e.startMonth),
      startYear: e.startYear === '' || e.startYear == null ? '' : Number(e.startYear),
      endMonth: e.endMonth === '' || e.endMonth == null ? '' : Number(e.endMonth),
      endYear: e.endYear === '' || e.endYear == null ? '' : Number(e.endYear),
      current: !!e.current
    });
    const mapEdu = (ed) => ({
      degree: ed.degree ?? '',
      school: ed.school ?? '',
      desc: ed.desc ?? '',
      startMonth: ed.startMonth === '' || ed.startMonth == null ? '' : Number(ed.startMonth),
      startYear: ed.startYear === '' || ed.startYear == null ? '' : Number(ed.startYear),
      endMonth: ed.endMonth === '' || ed.endMonth == null ? '' : Number(ed.endMonth),
      endYear: ed.endYear === '' || ed.endYear == null ? '' : Number(ed.endYear),
      current: !!ed.current
    });
    return {
      personal,
      experiences: Array.isArray(src.experiences) ? src.experiences.map(mapExp) : [],
      educations: Array.isArray(src.educations) ? src.educations.map(mapEdu) : [],
      skills: Array.isArray(src.skills) ? src.skills.filter(Boolean) : [],
      interests: Array.isArray(src.interests) ? src.interests.filter(Boolean) : []
    };
  }

  const loadedBundle = loadBundleFromStorage();
  const allowedLayouts = new Set(['split', 'classic', 'minimal']);
  let appState = {
    layout: allowedLayouts.has(loadedBundle?.layout) ? loadedBundle.layout : 'split',
    cv: normalizeCv(loadedBundle?.cv ?? null),
    theme: loadedBundle?.theme === 'dark' ? 'dark' : 'light',
    paletteFlow: clampPaletteIndex(loadedBundle?.paletteFlow),
    paletteSplit: clampPaletteIndex(loadedBundle?.paletteSplit)
  };

  // Utilitaires DOM
  const $ = (selector) => document.querySelector(selector);
  const escapeHtml = (str) => String(str || '').replace(/[&<>"']/g, (m) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
  }[m]));

  let persistTimer = null;
  function persistBundle() {
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          cv: appState.cv,
          layout: appState.layout,
          theme: appState.theme,
          paletteFlow: appState.paletteFlow,
          paletteSplit: appState.paletteSplit
        })
      );
    } catch {
      /* quota / private mode */
    }
  }
  function persistBundleImmediate() {
    clearTimeout(persistTimer);
    persistBundle();
  }
  function schedulePersist() {
    clearTimeout(persistTimer);
    persistTimer = setTimeout(persistBundle, 400);
  }

  let previewFrame = null;
  function scheduleRenderPreview() {
    if (previewFrame != null) return;
    previewFrame = requestAnimationFrame(() => {
      previewFrame = null;
      renderPreview();
    });
  }

  function applyCvShellStyle() {
    const root = $('#resumePreview');
    if (!root) return;
    [...root.classList].forEach((c) => {
      if (c.startsWith('cv-skin-')) root.classList.remove(c);
    });
    const skin =
      appState.layout === 'split'
        ? `cv-skin-split-${appState.paletteSplit}`
        : `cv-skin-flow-${appState.paletteFlow}`;
    root.classList.add(skin);
  }

  function updatePaletteUI() {
    const split = appState.layout === 'split';
    const fb = $('#paletteFlowBlock');
    const sb = $('#paletteSplitBlock');
    if (fb) fb.hidden = split;
    if (sb) sb.hidden = !split;
  }

  function refreshPaletteSwatchAria() {
    document.querySelectorAll('#paletteFlowSwatches .swatch').forEach((b, i) => {
      b.setAttribute('aria-pressed', appState.paletteFlow === i ? 'true' : 'false');
    });
    document.querySelectorAll('#paletteSplitSwatches .swatch').forEach((b, i) => {
      b.setAttribute('aria-pressed', appState.paletteSplit === i ? 'true' : 'false');
    });
  }

  function initPaletteControls() {
    const flowWrap = $('#paletteFlowSwatches');
    const splitWrap = $('#paletteSplitSwatches');
    if (!flowWrap || !splitWrap) return;
    const flowColors = ['#0e5d63', '#1e3a5f', '#6b21a8', '#166534', '#9a3412', '#0f766e'];
    const splitColors = ['#0e5d63', '#3730a3', '#9d174d', '#3f6212', '#b45309', '#44403c'];
    const labelFlow = ['Ardoise', 'Nuit', 'Violet', 'Forêt', 'Brique', 'Lagon'];
    const labelSplit = ['Lagune', 'Indigo', 'Framboise', 'Olive', 'Miel', 'Graphite'];
    flowWrap.innerHTML = '';
    splitWrap.innerHTML = '';
    flowColors.forEach((c, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch';
      b.style.background = `linear-gradient(145deg, ${c}, ${c}dd)`;
      b.title = labelFlow[i];
      b.addEventListener('click', () => {
        appState.paletteFlow = i;
        refreshPaletteSwatchAria();
        applyCvShellStyle();
        schedulePersist();
      });
      flowWrap.appendChild(b);
    });
    splitColors.forEach((c, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch';
      b.style.background = `linear-gradient(145deg, ${c}, ${c}dd)`;
      b.title = labelSplit[i];
      b.addEventListener('click', () => {
        appState.paletteSplit = i;
        refreshPaletteSwatchAria();
        applyCvShellStyle();
        schedulePersist();
      });
      splitWrap.appendChild(b);
    });
    refreshPaletteSwatchAria();
  }

  // --------------------------------------------------------------
  // 2. LOGIQUE MÉTIER : SCORE ATS, RENDU HTML
  // --------------------------------------------------------------
  function hasCompleteStart(item) {
    return item.startMonth && item.startYear;
  }

  function periodHtml(item) {
    if (!hasCompleteStart(item)) return '';
    const sm = Number(item.startMonth);
    const sy = Number(item.startYear);
    const isoStart = `${sy}-${String(sm).padStart(2, '0')}`;
    const startHuman = `${MONTHS_FR[sm]} ${sy}`;
    if (item.current) {
      return `<div class="entry-period" aria-label="Période"><time datetime="${escapeHtml(isoStart)}">${escapeHtml(startHuman)}</time> – <span>présent</span></div>`;
    }
    if (item.endMonth && item.endYear) {
      const em = Number(item.endMonth);
      const ey = Number(item.endYear);
      const isoEnd = `${ey}-${String(em).padStart(2, '0')}`;
      const endHuman = `${MONTHS_FR[em]} ${ey}`;
      return `<div class="entry-period" aria-label="Période"><time datetime="${escapeHtml(isoStart)}">${escapeHtml(startHuman)}</time> – <time datetime="${escapeHtml(isoEnd)}">${escapeHtml(endHuman)}</time></div>`;
    }
    return `<div class="entry-period" aria-label="Période"><time datetime="${escapeHtml(isoStart)}">${escapeHtml(startHuman)}</time></div>`;
  }

  function computeAtsScore() {
    const cv = appState.cv;
    let score = 0;
    if (cv.personal.name) score += 8;
    if (cv.personal.title) score += 8;
    if (cv.personal.email) score += 8;
    if (cv.personal.phone) score += 4;
    if (cv.personal.address) score += 4;
    if ((cv.personal.summary || '').length > 120) score += 8;
    cv.experiences.forEach((exp) => {
      if ((exp.desc || '').length > 80) score += 7;
      if (/gestion|pilotage|analyse|projet|coordination|résultat|livraison/i.test(exp.desc || '')) score += 6;
      if (hasCompleteStart(exp)) score += 8;
      if (exp.current || (exp.endMonth && exp.endYear)) score += 4;
    });
    cv.educations.forEach((edu) => {
      if ((edu.desc || '').length > 50) score += 4;
      if (hasCompleteStart(edu)) score += 5;
    });
    score += Math.min(cv.skills.length * 4, 24);
    score += Math.min(cv.interests.length * 2, 8);
    return Math.min(Math.round(score), 100);
  }

  function renderEntry(item) {
    const title = item.job || item.degree;
    const subtitle = item.company || item.school;
    const period = periodHtml(item);
    return `
      <article class="entry">
        <div class="head">
          <div>
            <h3 class="entry-title">${escapeHtml(title)}</h3>
            <p class="entry-sub">${escapeHtml(subtitle)}</p>
          </div>
          ${period}
        </div>
        <p class="entry-desc">${escapeHtml(item.desc)}</p>
      </article>
    `;
  }

  function renderContactBlock(personal) {
    const lines = [];
    if (personal.phone) {
      const tel = escapeHtml(personal.phone.replace(/\s/g, ''));
      lines.push(`<li><span class="lbl">Tél.</span><a href="tel:${tel}">${escapeHtml(personal.phone)}</a></li>`);
    }
    if (personal.email) {
      lines.push(`<li><span class="lbl">Email</span><a href="mailto:${escapeHtml(personal.email)}">${escapeHtml(personal.email)}</a></li>`);
    }
    if (personal.address) lines.push(`<li><span class="lbl">Adresse</span>${escapeHtml(personal.address)}</li>`);
    if (!lines.length) return '';
    return `<div class="contact-grid"><ul class="contact-lines">${lines.join('')}</ul></div>`;
  }

  function renderSideContact(p) {
    const parts = [];
    if (p.phone) {
      const tel = escapeHtml(String(p.phone).replace(/\s/g, ''));
      parts.push(`<li><span class="lbl">Tél.</span> <a href="tel:${tel}">${escapeHtml(p.phone)}</a></li>`);
    }
    if (p.email) parts.push(`<li><span class="lbl">Email</span> <a href="mailto:${escapeHtml(p.email)}">${escapeHtml(p.email)}</a></li>`);
    if (p.address) parts.push(`<li><span class="lbl">Adresse</span> ${escapeHtml(p.address)}</li>`);
    if (!parts.length) return '';
    return `<ul class="contact-lines">${parts.join('')}</ul>`;
  }

  function monthOptions(selected) {
    let html = '<option value="">Mois</option>';
    for (let m = 1; m <= 12; m++) {
      const sel = Number(selected) === m ? ' selected' : '';
      html += `<option value="${m}"${sel}>${MONTHS_FR[m]}</option>`;
    }
    return html;
  }

  function skillsListHtml(skills) {
    if (!skills.length) return '<p class="entry-sub">Aucune compétence</p>';
    return `<ul class="skill-list">${skills.map((s) => `<li>${escapeHtml(s)}</li>`).join('')}</ul>`;
  }
  function interestsListHtml(list) {
    if (!list.length) return '<p class="entry-sub">Aucun centre d’intérêt</p>';
    return `<ul class="interest-list">${list.map((i) => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`;
  }

  // Générateur d'aperçu selon le template
  function renderPreview() {
    const cv = appState.cv;
    const p = cv.personal;
    const skillsHtml = skillsListHtml(cv.skills);
    const interestsHtml = interestsListHtml(cv.interests);
    const contactHtml = renderContactBlock(p);

    const experiencesHtml = cv.experiences.map(renderEntry).join('') || '<p class="entry-desc">Ajoutez vos expériences.</p>';
    const educationsHtml = cv.educations.map(renderEntry).join('') || '<p class="entry-desc">Ajoutez vos formations.</p>';
    const separator = '<hr class="section-separator">';

    if (appState.layout === 'split') {
      const preview = `
        <article class="resume" itemscope itemtype="https://schema.org/Person">
          <aside class="side" aria-label="Informations complémentaires">
            <h1 class="name" itemprop="name">${escapeHtml(p.name) || 'Votre nom'}</h1>
            <p class="role">${escapeHtml(p.title) || 'Titre professionnel'}</p>
            <div class="block"><div class="label2">Contact</div>${renderSideContact(p) || '<p class="entry-sub">—</p>'}</div>
            <div class="block"><div class="label2">Profil</div><p class="entry-desc" itemprop="description">${escapeHtml(p.summary || '')}</p></div>
            <div class="block"><div class="label2">Compétences</div>${skillsHtml}</div>
            <div class="block"><div class="label2">Centres d’intérêt</div>${interestsHtml}</div>
          </aside>
          <div class="main">
            <section class="sec2" aria-label="Expériences professionnelles"><h2>Expériences</h2>${experiencesHtml}</section>
            ${separator}
            <section class="sec2" aria-label="Formations"><h2>Formations</h2>${educationsHtml}</section>
          </div>
        </article>
      `;
      $('#resumePreview').innerHTML = preview;
    } else if (appState.layout === 'classic') {
      const preview = `
        <article class="resume resume--flow" style="grid-template-columns:1fr" itemscope itemtype="https://schema.org/Person">
          <div class="main" style="padding-top:0">
            <header>
              <h1 class="name" style="font-size:46px" itemprop="name">${escapeHtml(p.name) || 'Votre nom'}</h1>
              <p class="role">${escapeHtml(p.title) || 'Titre professionnel'}</p>
            </header>
            ${contactHtml}
            <p class="entry-desc" style="margin-top:10px" itemprop="description">${escapeHtml(p.summary || '')}</p>
            <section class="sec2"><h2>Expériences</h2>${experiencesHtml}</section>
            ${separator}
            <section class="sec2"><h2>Formations</h2>${educationsHtml}</section>
            <section class="sec2"><h2>Compétences</h2>${skillsHtml}</section>
            <section class="sec2"><h2>Centres d’intérêt</h2>${interestsHtml}</section>
          </div>
        </article>
      `;
      $('#resumePreview').innerHTML = preview;
    } else {
      const preview = `
        <article class="resume resume--flow" style="grid-template-columns:1fr" itemscope itemtype="https://schema.org/Person">
          <div class="main" style="padding-top:0">
            <header>
              <h1 class="name" style="font-size:46px" itemprop="name">${escapeHtml(p.name) || 'Votre nom'}</h1>
              <p class="role">${escapeHtml(p.title) || 'Titre professionnel'}</p>
            </header>
            ${contactHtml}
            <p class="entry-desc" style="margin-top:10px; margin-bottom:20px;" itemprop="description">${escapeHtml(p.summary || '')}</p>
            <section class="sec2"><h2>Expériences</h2>${experiencesHtml}</section>
            ${separator}
            <section class="sec2"><h2>Formations</h2>${educationsHtml}</section>
            <section class="sec2"><h2>Compétences</h2>${skillsHtml}</section>
            <section class="sec2"><h2>Centres d’intérêt</h2>${interestsHtml}</section>
          </div>
        </article>
      `;
      $('#resumePreview').innerHTML = preview;
    }

    const ats = computeAtsScore();
    $('#score').textContent = ats;
    $('#ring').style.setProperty('--score', ats / 100);
    const hints = [];
    if (!p.phone) hints.push('téléphone');
    if (!p.address) hints.push('adresse');
    if (!cv.experiences.some(hasCompleteStart)) hints.push('dates d’expérience (mois / année)');
    $('#scoreText').textContent = hints.length
      ? `Score ATS : ${ats}% — Complétez : ${hints.join(', ')}.`
      : `Score ATS : ${ats}% — Bonne base pour les parseurs ATS et le PDF.`;
    applyCvShellStyle();
    refreshPaletteSwatchAria();
    schedulePersist();
  }

  // --------------------------------------------------------------
  // 3. SYNCHRONISATION ÉDITEUR ↔ STATE
  // --------------------------------------------------------------
  function refreshEditorFromState() {
    const cv = appState.cv;
    $('#layoutSel').value = appState.layout;
    $('#name').value = cv.personal.name || '';
    $('#title').value = cv.personal.title || '';
    $('#phone').value = cv.personal.phone || '';
    $('#email').value = cv.personal.email || '';
    $('#address').value = cv.personal.address || '';
    $('#summary').value = cv.personal.summary || '';

    // Expériences
    const expContainer = $('#expList');
    expContainer.innerHTML = '';
    const yearVal = (y) => (y === '' || y == null ? '' : escapeHtml(String(y)));
    cv.experiences.forEach((exp, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.i = String(idx);
      card.innerHTML = `
        <div class="grid">
          <div class="field full"><label>Poste</label><input data-k="job" value="${escapeHtml(exp.job)}"></div>
          <div class="field full"><label>Entreprise</label><input data-k="company" value="${escapeHtml(exp.company)}"></div>
        </div>
        <div class="date-row">
          <div class="field"><label>Début — mois</label><select data-k="startMonth">${monthOptions(exp.startMonth)}</select></div>
          <div class="field"><label>Début — année</label><input data-k="startYear" type="number" inputmode="numeric" min="1970" max="2038" placeholder="ex. 2020" value="${yearVal(exp.startYear)}"></div>
        </div>
        <div class="date-row">
          <div class="field"><label>Fin — mois</label><select data-k="endMonth">${monthOptions(exp.endMonth)}</select></div>
          <div class="field"><label>Fin — année</label><input data-k="endYear" type="number" inputmode="numeric" min="1970" max="2038" placeholder="ex. 2023" value="${yearVal(exp.endYear)}"></div>
        </div>
        <div class="chk-row"><label><input type="checkbox" data-k="current" ${exp.current ? 'checked' : ''}> En poste / actuel</label></div>
        <div class="field"><label>Description</label><textarea data-k="desc">${escapeHtml(exp.desc)}</textarea></div>
      `;
      expContainer.appendChild(card);
    });

    const eduContainer = $('#eduList');
    eduContainer.innerHTML = '';
    cv.educations.forEach((edu, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.i = String(idx);
      card.innerHTML = `
        <div class="grid">
          <div class="field full"><label>Diplôme</label><input data-k="degree" value="${escapeHtml(edu.degree)}"></div>
          <div class="field full"><label>École</label><input data-k="school" value="${escapeHtml(edu.school)}"></div>
        </div>
        <div class="date-row">
          <div class="field"><label>Début — mois</label><select data-k="startMonth">${monthOptions(edu.startMonth)}</select></div>
          <div class="field"><label>Début — année</label><input data-k="startYear" type="number" inputmode="numeric" min="1970" max="2038" placeholder="ex. 2018" value="${yearVal(edu.startYear)}"></div>
        </div>
        <div class="date-row">
          <div class="field"><label>Fin — mois</label><select data-k="endMonth">${monthOptions(edu.endMonth)}</select></div>
          <div class="field"><label>Fin — année</label><input data-k="endYear" type="number" inputmode="numeric" min="1970" max="2038" placeholder="ex. 2020" value="${yearVal(edu.endYear)}"></div>
        </div>
        <div class="chk-row"><label><input type="checkbox" data-k="current" ${edu.current ? 'checked' : ''}> En cours</label></div>
        <div class="field"><label>Description</label><textarea data-k="desc">${escapeHtml(edu.desc)}</textarea></div>
      `;
      eduContainer.appendChild(card);
    });

    // Compétences (tags avec suppression)
    $('#skillsList').innerHTML = cv.skills.map((s, i) => `<span class="tag">${escapeHtml(s)} <button data-rm-skill="${i}">×</button></span>`).join('');
    $('#interestList').innerHTML = cv.interests.map((h, i) => `<span class="tag">${escapeHtml(h)} <button data-rm-int="${i}">×</button></span>`).join('');

    function bindCollectionCards(listSelector, key) {
      document.querySelectorAll(`${listSelector} .card input, ${listSelector} .card textarea, ${listSelector} .card select`).forEach((el) => {
        const onEdit = () => {
          const card = el.closest('.card');
          const idx = parseInt(card.dataset.i, 10);
          const k = el.dataset.k;
          const row = appState.cv[key][idx];
          if (el.type === 'checkbox') {
            row[k] = el.checked;
            if (k === 'current' && el.checked) {
              row.endMonth = '';
              row.endYear = '';
            }
          } else if (el.tagName === 'SELECT') {
            row[k] = el.value === '' ? '' : Number(el.value);
          } else if (el.type === 'number') {
            const v = el.value.trim();
            row[k] = v === '' ? '' : Number(v);
          } else {
            row[k] = el.value;
          }
          scheduleRenderPreview();
          if (el.type === 'checkbox' && k === 'current') refreshEditorFromState();
        };
        el.addEventListener('input', onEdit);
        el.addEventListener('change', onEdit);
      });
    }
    bindCollectionCards('#expList', 'experiences');
    bindCollectionCards('#eduList', 'educations');

    document.querySelectorAll('[data-rm-skill]').forEach((btn) => {
      btn.onclick = () => {
        appState.cv.skills.splice(parseInt(btn.dataset.rmSkill, 10), 1);
        renderPreview();
        refreshEditorFromState();
      };
    });
    document.querySelectorAll('[data-rm-int]').forEach((btn) => {
      btn.onclick = () => {
        appState.cv.interests.splice(parseInt(btn.dataset.rmInt, 10), 1);
        renderPreview();
        refreshEditorFromState();
      };
    });
  }

  // --------------------------------------------------------------
  // 4. GESTION DES ÉVÉNEMENTS & INITIALISATION
  // --------------------------------------------------------------
  function bindEvents() {
    // Thème clair/sombre
    $('#themeBtn').onclick = () => {
      appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
      document.body.dataset.theme = appState.theme;
      $('#themeBtn').textContent = appState.theme === 'dark' ? 'Mode clair' : 'Mode sombre';
      schedulePersist();
    };

    // Changement de template
    $('#layoutSel').onchange = (e) => {
      appState.layout = e.target.value;
      updatePaletteUI();
      renderPreview();
    };

    // Champs personnels
    ['name', 'title', 'phone', 'email', 'address', 'summary'].forEach((id) => {
      $(`#${id}`).oninput = (e) => {
        appState.cv.personal[id] = e.target.value;
        scheduleRenderPreview();
      };
    });

    const emptyDates = () => ({
      startMonth: '',
      startYear: '',
      endMonth: '',
      endYear: '',
      current: false
    });

    $('#addExp').onclick = () => {
      appState.cv.experiences.push({ job: 'Nouveau poste', company: 'Entreprise', desc: '', ...emptyDates() });
      renderPreview();
      refreshEditorFromState();
    };
    $('#addEdu').onclick = () => {
      appState.cv.educations.push({ degree: 'Diplôme', school: 'Établissement', desc: '', ...emptyDates() });
      renderPreview();
      refreshEditorFromState();
    };

    // Compétences
    $('#addSkill').onclick = () => {
      const val = $('#skillInput').value.trim();
      if (val) {
        appState.cv.skills.push(val);
        $('#skillInput').value = '';
        renderPreview();
        refreshEditorFromState();
      }
    };
    $('#skillInput').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#addSkill').click(); } };

    // Centres d'intérêt
    $('#addInterest').onclick = () => {
      const val = $('#interestInput').value.trim();
      if (val) {
        appState.cv.interests.push(val);
        $('#interestInput').value = '';
        renderPreview();
        refreshEditorFromState();
      }
    };
    $('#interestInput').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#addInterest').click(); } };

    // Boutons reset & demo
    $('#resetBtn').onclick = () => {
      appState.cv = normalizeCv(null);
      appState.layout = 'split';
      appState.theme = 'light';
      appState.paletteFlow = 0;
      appState.paletteSplit = 0;
      document.body.dataset.theme = 'light';
      $('#themeBtn').textContent = 'Mode sombre';
      $('#layoutSel').value = 'split';
      updatePaletteUI();
      persistBundleImmediate();
      renderPreview();
      refreshEditorFromState();
    };
    $('#demoBtn').onclick = () => {
      appState.cv = normalizeCv(structuredClone(DEMO_DATA));
      renderPreview();
      refreshEditorFromState();
    };

    // Lettre de motivation — 6 modèles, rotation au clic sur « Générer »
    let letterVariantIndex = 0;

    function buildMotivationLetter(variant) {
      const p = appState.cv.personal;
      const title = (p.title || 'votre poste').trim();
      const name = (p.name || 'Votre nom').trim();
      const v = ((variant % 6) + 6) % 6;
      const templates = [
        () =>
          `Objet : Candidature au poste de ${title}\n\nMadame, Monsieur,\n\nJe vous adresse ma candidature pour le poste de ${title}. Mon expérience en gestion de projet, coordination d’équipes et amélioration des parcours clients me permet de contribuer rapidement à vos objectifs.\n\nCordialement,\n${name}`,
        () =>
          `Objet : Candidature — ${title}\n\nMadame, Monsieur,\n\nFortement intéressé(e) par votre structure, je souhaite vous faire part de ma motivation pour le poste de ${title}. J’ai piloté des projets multi-acteurs, sécurisé les livrables et renforcé la qualité des échanges avec les parties prenantes. Je serais ravi(e) d’en discuter avec vous.\n\nCordialement,\n${name}`,
        () =>
          `Objet : Poste de ${title}\n\nMadame, Monsieur,\n\nPar la présente, je me permets de vous transmettre ma candidature pour le poste de ${title}. Mon parcours m’a permis de structurer des priorités, d’animer des équipes en mode agile et d’aligner les livraisons sur les objectifs métier. Je reste à votre disposition pour un entretien.\n\nBien cordialement,\n${name}`,
        () =>
          `Objet : Candidature spontanée — ${title}\n\nMadame, Monsieur,\n\nVotre organisation et ses enjeux correspondent à la direction que je souhaite donner à ma carrière. En tant que ${title}, je peux apporter une approche rigoureuse de la planification, une communication claire et une culture du résultat. Je vous remercie pour l’attention portée à ma candidature.\n\nCordialement,\n${name}`,
        () =>
          `Objet : Candidature au poste de ${title}\n\nMadame, Monsieur,\n\nJe vous écris pour exprimer mon intérêt pour le poste de ${title}. J’ai une solide expérience de la conduite de projet, du cadrage au suivi budgétaire, ainsi qu’une appétence marquée pour l’innovation utile et l’amélioration continue. Je suis disponible pour échanger sur la manière dont je pourrais contribuer à vos équipes.\n\nCordialement,\n${name}`,
        () =>
          `Objet : ${title}\n\nMadame, Monsieur,\n\nPermettez-moi de vous présenter ma candidature pour ${title}. Au fil de mes missions, j’ai développé une capacité à fédérer les talents, à rendre les décisions traçables et à sécuriser les délais dans des contextes exigeants. Je serais honoré(e) d’explorer avec vous les synergies possibles.\n\nBien à vous,\n${name}`
      ];
      return templates[v]();
    }

    $('#lmBtn').onclick = () => {
      $('#lmArea').value = buildMotivationLetter(letterVariantIndex);
      $('#lmModal').classList.add('open');
    };
    $('#genLmBtn').onclick = () => {
      letterVariantIndex = (letterVariantIndex + 1) % 6;
      $('#lmArea').value = buildMotivationLetter(letterVariantIndex);
    };
    $('#printLmBtn').onclick = () => {
      const win = window.open('', '_blank');
      win.document.write(`<pre style="white-space:pre-wrap;font:16px Arial;padding:24px">${escapeHtml($('#lmArea').value)}</pre>`);
      win.document.close();
      win.print();
    };
    $('#closeLmBtn').onclick = () => $('#lmModal').classList.remove('open');
    $('#lmModal').onclick = (e) => { if (e.target.id === 'lmModal') $('#lmModal').classList.remove('open'); };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#lmModal').classList.remove('open'); });

    // Impression du CV
    $('#printBtn').onclick = () => window.print();
  }

  // Lancement
  function init() {
    bindEvents();
    document.body.dataset.theme = appState.theme;
    $('#themeBtn').textContent = appState.theme === 'dark' ? 'Mode clair' : 'Mode sombre';
    $('#layoutSel').value = appState.layout;
    initPaletteControls();
    updatePaletteUI();
    renderPreview();
    refreshEditorFromState();
  }

  init();
</script>
</body>
</html>
